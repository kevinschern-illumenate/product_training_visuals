<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LED Tape System Visualizer</title>
<!--
  LED Tape System Visualizer — single-file, no build step.
  Open this file in a desktop browser. The only external dependency is Three.js
  (pinned r128 UMD build from cdnjs). All geometry, textures and fonts are generated
  or use system fonts.

  Code map (search for the "=====" banners):
    0. BRAND & GLOBAL CONSTANTS     <- change colors / units / scale here
    1. SYSTEM DATA                  <- layers, profiles, zones, camera presets
    2. UTILITIES
    3. RENDERER, SCENE, CAMERAS, LIGHTS
    4. ORBIT CONTROLS (built in)
    5. MATERIALS
    6. LAYER REGISTRY & VISIBILITY
    7. GEOMETRY BUILDERS — ARCHITECTURE (one function per element)
    8. GEOMETRY BUILDERS — LED COMPONENTS (profile shapes, assembly)
    9. GEOMETRY BUILDERS — POWER, CONTROLS, WIRING
   10. SYSTEM BUILD (zones -> geometry)
   11. LABELS, CALLOUTS & DIMENSIONS (2D overlay, included in exports)
   12. LIGHTING STATE (glow, brightness, CCT, dim)
   13. EXPLODED VIEW & CROSS-SECTION
   14. FLAT SYSTEM DIAGRAM (schematic)
   15. CAMERA PRESETS & SAVED VIEWS
   16. UI (side panel)
   17. EXPORT
   18. LAYOUT, RESIZE & RENDER LOOP
-->
<style>
  :root {
    --panel-w: 340px;
    --ui-font: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --brand: #1F4E79;
    --brand-ink: #ffffff;
    --accent: #F2A900;
    --ui-bg: #ffffff;
    --ui-bg-2: #f4f5f7;
    --ui-border: #e1e4e8;
    --ui-text: #1d232b;
    --ui-muted: #6a7380;
    --letterbox: #c9ced5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font-family: var(--ui-font); color: var(--ui-text); background: var(--letterbox); font-size: 13px; }
  #app { display: flex; width: 100%; height: 100%; }

  /* ---------- viewport ---------- */
  #viewport { position: relative; flex: 1 1 auto; min-width: 0; overflow: hidden; background: var(--letterbox); }
  #stage { position: absolute; left: 0; top: 0; overflow: hidden; }
  #stage canvas { position: absolute; left: 0; top: 0; display: block; }
  #gl { cursor: grab; outline: none; }
  #gl.dragging { cursor: grabbing; }
  #overlay { pointer-events: none; }
  #stage.checker {
    background-color: #ffffff;
    background-image:
      linear-gradient(45deg, #e4e7eb 25%, transparent 25%),
      linear-gradient(-45deg, #e4e7eb 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #e4e7eb 75%),
      linear-gradient(-45deg, transparent 75%, #e4e7eb 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0;
  }
  .vp-chip {
    position: absolute; background: rgba(255,255,255,.92); border: 1px solid var(--ui-border);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--ui-text);
    box-shadow: 0 2px 8px rgba(20,30,40,.08); user-select: none;
  }
  #viewBadge { left: 12px; top: 12px; font-weight: 600; }
  #viewBadge small { font-weight: 400; color: var(--ui-muted); margin-left: 6px; }
  #hint { left: 12px; bottom: 12px; color: var(--ui-muted); }
  #panelTab {
    position: absolute; right: 12px; top: 12px; width: 34px; height: 34px; padding: 0;
    border-radius: 8px; border: 1px solid var(--ui-border); background: rgba(255,255,255,.95);
    cursor: pointer; font-size: 16px; color: var(--ui-text); box-shadow: 0 2px 8px rgba(20,30,40,.08);
  }
  #panelTab:hover { background: var(--ui-bg-2); }
  #toast {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(20px);
    background: #1d232b; color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 12.5px;
    opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; white-space: nowrap;
  }
  #toast.show { opacity: .95; transform: translateX(-50%) translateY(0); }
  #captureHint {
    position: absolute; right: 12px; top: 12px; background: rgba(29,35,43,.85); color: #fff;
    padding: 6px 10px; border-radius: 6px; font-size: 12px; opacity: 0; transition: opacity .6s;
    pointer-events: none;
  }
  #captureHint.show { opacity: 1; }
  body.capture .ui { display: none !important; }

  /* ---------- side panel ---------- */
  #panel {
    width: var(--panel-w); flex: 0 0 var(--panel-w); background: var(--ui-bg);
    border-left: 1px solid var(--ui-border); display: flex; flex-direction: column; min-height: 0;
  }
  #app.collapsed #panel { display: none; }
  #panelHead { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--ui-border); }
  #brandMark { width: 28px; height: 28px; border-radius: 7px; background: var(--brand); position: relative; flex: none; }
  #brandMark::after { content: ""; position: absolute; left: 6px; right: 6px; top: 12px; height: 4px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  #panelHead h1 { font-size: 14px; margin: 0; line-height: 1.2; }
  #panelHead p { margin: 1px 0 0; font-size: 11.5px; color: var(--ui-muted); }
  #panelBody { flex: 1 1 auto; overflow-y: auto; padding: 4px 0 12px; }
  #panelFoot { border-top: 1px solid var(--ui-border); padding: 10px 14px 12px; background: var(--ui-bg-2); }

  details.sec { border-bottom: 1px solid var(--ui-border); }
  details.sec > summary {
    list-style: none; cursor: pointer; padding: 10px 14px; font-weight: 600; font-size: 12px;
    text-transform: uppercase; letter-spacing: .06em; color: var(--ui-muted); display: flex; align-items: center;
  }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary::after { content: "▸"; margin-left: auto; transition: transform .15s; }
  details.sec[open] > summary::after { transform: rotate(90deg); }
  .sec-body { padding: 0 14px 12px; }
  .sub { font-size: 11px; font-weight: 600; color: var(--ui-muted); margin: 10px 0 6px; text-transform: uppercase; letter-spacing: .05em; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .row > .grow { flex: 1 1 auto; }
  .row label { flex: 1 1 auto; }
  .val { min-width: 42px; text-align: right; color: var(--ui-muted); font-variant-numeric: tabular-nums; }
  input[type=range] { flex: 1 1 auto; accent-color: var(--brand); min-width: 60px; }
  input[type=checkbox] { accent-color: var(--brand); margin: 0; width: 15px; height: 15px; }
  select, input[type=text] {
    font: inherit; padding: 5px 7px; border: 1px solid var(--ui-border); border-radius: 6px; background: #fff; color: var(--ui-text); min-width: 0;
  }
  select { flex: 1 1 auto; }
  .btn {
    font: inherit; font-size: 12px; padding: 6px 9px; border-radius: 6px; border: 1px solid var(--ui-border);
    background: #fff; color: var(--ui-text); cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: var(--ui-bg-2); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.mini { font-size: 11px; padding: 3px 7px; }
  .btn.active { border-color: var(--brand); color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .seg { display: flex; border: 1px solid var(--ui-border); border-radius: 7px; overflow: hidden; }
  .seg button { flex: 1 1 0; font: inherit; font-size: 12px; padding: 6px 4px; border: 0; background: #fff; cursor: pointer; color: var(--ui-text); }
  .seg button + button { border-left: 1px solid var(--ui-border); }
  .seg button.on { background: var(--brand); color: var(--brand-ink); font-weight: 600; }
  .grp { border: 1px solid var(--ui-border); border-radius: 8px; margin: 8px 0; }
  .grp-head { display: flex; align-items: center; gap: 4px; padding: 6px 8px; background: var(--ui-bg-2); border-radius: 8px 8px 0 0; }
  .grp-head strong { flex: 1 1 auto; font-size: 12.5px; }
  .grp-items { padding: 4px 8px 6px; }
  .chk { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
  .chk span { flex: 1 1 auto; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .zone-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .zone-row label { display: flex; align-items: center; gap: 8px; flex: 1 1 auto; cursor: pointer; }
  .slot { display: flex; gap: 5px; align-items: center; margin: 4px 0; }
  .slot .num { width: 16px; color: var(--ui-muted); font-size: 11px; text-align: center; }
  .slot input { flex: 1 1 auto; width: 0; font-size: 12px; padding: 4px 6px; }
  .slot.filled .num { color: var(--brand); font-weight: 700; }
  .bgs { display: flex; gap: 6px; }
  .bgs button {
    flex: 1 1 0; height: 34px; border-radius: 7px; border: 1px solid var(--ui-border); cursor: pointer; font: inherit; font-size: 11px;
  }
  .bgs button.on { box-shadow: 0 0 0 2px var(--brand); }
  .note { font-size: 11px; color: var(--ui-muted); margin: 6px 0 0; line-height: 1.35; }
  .kbd { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; border: 1px solid var(--ui-border); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: #fff; }
  #exportBtn { width: 100%; padding: 9px; font-size: 13px; margin-top: 8px; }
</style>
</head>

<div id="app">
  <main id="viewport">
    <div id="stage">
      <canvas id="gl" tabindex="0"></canvas>

    <div id="toast"></div>
    <div id="captureHint">Capture mode — press H or Esc to show the UI</div>
  </main>
  <aside id="panel" class="ui">
    <div id="panelHead">
      <div id="brandMark"></div>

</div>

<script>
'use strict';

/* =====================================================================
   0. BRAND & GLOBAL CONSTANTS — change these to match your brand
   ===================================================================== */
const BRAND = {

  product:  'Residential LED Tape Lighting',

// One color per zone (order matches ZONES below). Tints wiring, labels and highlights.
const ZONE_COLORS = ['#E8772E', '#2F7CF6', '#1FA463', '#8B4FE8', '#00A2B8'];

const COLORS = {
  arch:        '#e2e5e9',  // walls, cabinets, shelving (neutral light gray)
  archAlt:     '#d9dde2',  // tile / accent surfaces
  floor:       '#d6dade',
  archEdge:    '#9ea6b0',  // architectural outline lines
  aluminum:    '#cfd4da',
  clip:        '#8f979f',
  endCap:      '#e8eaed',
  gasket:      '#3a4048',
  diffuser:    '#f7f8fa',
  pcb:         '#f3eee2',
  chip:        '#f2d470',  // LED phosphor when unlit
  connector:   '#eef1f4',
  psuBody:     '#5a616c',
  plate:       '#f7f7f4',  // dimmer wall plate
  panel:       '#c3c9d0',  // breaker panel
  lineVoltage: '#2a2e35',  // line-voltage (120V) feed wire
  sectionCut:  '#8d97a3',  // cut face of aluminum in cross-section
};

// Background presets (null = transparent)
const BACKGROUNDS = {
  white:       { label: 'White',       color: '#ffffff', theme: 'light' },
  light:       { label: 'Light gray',  color: '#eceef1', theme: 'light' },
  dark:        { label: 'Dark',        color: '#1b1f25', theme: 'dark'  },
  transparent: { label: 'Transparent', color: null,      theme: 'light' },
};

// Color temperature tints for the tape and its glow
const CCT_COLORS = { 2700: '#ffb066', 3000: '#ffc184', 3500: '#ffd3a6', 4000: '#ffe3c4' };

const UNITS = 'imperial';        // 'imperial' (ft/in) or 'metric' (m/mm) for lengths in labels
const PROFILE_SCALE = 1.5;       // exaggerates channel cross-sections for legibility at room scale (1.0 = true size)
const WIRE_RADIUS = { lv: 0.0045, line: 0.006 }; // wire tube radii in meters (stylized, thicker than real)
const EXPLODE_STEP = 0.035;      // meters between parts at 100% exploded
const DEFAULT_EXPORT_SCALE = 2;

/* =====================================================================
   1. SYSTEM DATA — edit / extend here
   ---------------------------------------------------------------------

const LAYER_GROUPS = [
  { id: 'lighting',     label: 'Lighting' },
  { id: 'wiring',       label: 'Wiring' },
  { id: 'power',        label: 'Power' },
  { id: 'controls',     label: 'Controls' },

  { id: 'labels',       label: 'Labels' },
];

const LAYERS = [
  // lighting
  { id: 'tape',           group: 'lighting',     label: 'LED tape',                       on: true },
  { id: 'channels',       group: 'lighting',     label: 'Extrusions / channels',          on: true },

  { id: 'panel',          group: 'power',        label: 'Breaker panel',                  on: true },

  { id: 'dimmers',        group: 'controls',     label: 'Wall dimmers',                   on: true },

  { id: 'arch-floor',     group: 'architecture', label: 'Floor',                          on: true,  build: buildFloor },

const PROFILES = {

/* Dimmer bank location (left wall, facing +X) — one gang per zone. */
const DIMMER_BANK = { x: 0, y: 1.22, zc: 1.535, pitch: 0.046 };
/* Breaker panel (inside the closet, on its back wall, facing the room) */
const BREAKER = {
  box: [3.40, 3.76, 1.00, 1.70, -1.10, -1.02],  // x0,x1,y0,y1,z0,z1
  label: 'Breaker panel', sub: '120V AC · 15A lighting circuit', gauge: '14/2 NM-B',

/* ZONES — one entry per lighting zone. Coordinates are meters:

const ZONES = [
  {
    id: 'cove', surface: 'Cove ledge (top face)', code: 'Z1', name: 'Cove', profile: 'deep', wPerFt: 4.4,

      { o: [0, 2.40, 0.003], u: [4.65, 0, 0], v: [0, 0.298, 0], peak: 1.0, sigma: 0.9, k: 0.55, req: 'arch-walls' },

  },
  {

    ] }],
    psu: { pos: [1.75, 0.55, 0.012], normal: [0, 0, 1], watts: '60W', volts: '24V DC', location: 'Sink base cabinet' },
    dimmer: { type: 'ELV dimmer' },
    gauge: { lv: '18/2 AWG', line: '14/2 NM-B' },
    lineRoute: [[-0.045, 2.82, 'DZ'], [1.55, 2.82, 'DZ'], [1.55, 2.82, -0.06], [1.55, 0.55, -0.06], [1.55, 0.55, 0.033]],
    lvRoutes: [[[1.98, 0.55, 0.033], [1.98, 0.55, -0.06], [2.92, 0.55, -0.06], [2.92, 1.355, -0.06], [2.92, 1.355, 0.02], [2.99, 1.355, 0.02], [2.99, 1.355, 0.27]]],
    washes: [
      { o: [0, 0.912, 0.0], u: [3.0, 0, 0], v: [0, 0, 0.635], peak: 0.42, sigma: 0.5, k: 1.0, req: 'arch-base' },
      { o: [0, 0.91, 0.003], u: [3.0, 0, 0], v: [0, 0.46, 0], peak: 1.0, sigma: 0.75, k: 0.6, req: 'arch-walls' },
    ],

const _gradCache = {};

  for (let y = 0; y < H; y++) {

/** Polyline with rounded corners (for wire routing). */
function roundedPath(points, bend) {
  const pts = [];
  points.forEach((p) => { if (!pts.length || pts[pts.length - 1].distanceTo(p) > 1e-5) pts.push(p.clone()); });
  const path = new THREE.CurvePath();
  if (pts.length < 2) { path.add(new THREE.LineCurve3(pts[0], pts[0].clone().add(new THREE.Vector3(0, 0.001, 0)))); return path; }
  let prev = pts[0].clone();
  for (let i = 1; i < pts.length - 1; i++) {
    const a = pts[i - 1], p = pts[i], b = pts[i + 1];
    const d1 = p.clone().sub(a), d2 = b.clone().sub(p);
    const l1 = d1.length(), l2 = d2.length();
    const r = Math.min(bend, l1 * 0.5, l2 * 0.5);
    const p1 = p.clone().addScaledVector(d1.normalize(), -r);
    const p2 = p.clone().addScaledVector(d2.normalize(), r);
    if (prev.distanceTo(p1) > 1e-6) path.add(new THREE.LineCurve3(prev.clone(), p1.clone()));
    if (r > 1e-6) path.add(new THREE.QuadraticBezierCurve3(p1.clone(), p.clone(), p2.clone()));
    prev = p2;
  }
  path.add(new THREE.LineCurve3(prev.clone(), pts[pts.length - 1].clone()));
  return path;
}

  constructor(dom) {

    this.target = new THREE.Vector3(); this.theta = 0; this.phi = 1.2; this.radius = 8;
    this.enableRotate = true; this.minRadius = 0.03; this.maxRadius = 80;
    this.onChange = null; this.onUser = null;

    dom.addEventListener('pointermove', (e) => this._move(e));
    dom.addEventListener('pointerup', (e) => this._up(e));
    dom.addEventListener('pointercancel', (e) => this._up(e));
    dom.addEventListener('wheel', (e) => this._wheel(e), { passive: false });
    dom.addEventListener('contextmenu', (e) => e.preventDefault());
  }

    this.dom.setPointerCapture(e.pointerId);
    const pan = e.button === 1 || e.button === 2 || e.shiftKey || e.ctrlKey || e.metaKey || !this.enableRotate;
    this._drag = { mode: pan ? 'pan' : 'rotate', x: e.clientX, y: e.clientY, id: e.pointerId };

  _move(e) {

    cam.position.set(
      this.target.x + this.radius * s * Math.sin(this.theta),
      this.target.y + this.radius * Math.cos(this.phi),
      this.target.z + this.radius * s * Math.cos(this.theta));
    cam.up.set(0, 1, 0);
    cam.lookAt(this.target);
    cam.updateMatrixWorld();
    this.onChange && this.onChange();
  }
}

/* =====================================================================
   6. LAYER REGISTRY & VISIBILITY
   Every scene object that can be toggled is "tagged" with a layer id
   (and optionally a zone id). Visibility = layer on AND zone on AND extras.
   ===================================================================== */
const registry = [];
const layerOn = {};  LAYERS.forEach((l) => (layerOn[l.id] = l.on));
const zoneOn = {};   ZONES.forEach((z) => (zoneOn[z.id] = true));

/** Tag an object. opts: { zone, glow, requires:[layerIds], helper, when:()=>bool } */
function tag(obj, layer, opts = {}) {
  const entry = Object.assign({ obj, layer, zone: null }, opts);
  registry.push(entry);
  obj.userData.entry = entry;
  return obj;
}
function untag(obj) {
  const i = registry.findIndex((e) => e.obj === obj);
  if (i >= 0) registry.splice(i, 1);
}
function entryVisible(e) {
  if (e.layer && !layerOn[e.layer]) return false;
  if (e.zone && !zoneOn[e.zone]) return false;
  if (e.glow && !glowActive()) return false;
  if (e.requires && !e.requires.every((id) => layerOn[id])) return false;
  if (e.helper && state.hideUI) return false;
  if (e.when && !e.when()) return false;
  return true;
}
function applyVisibility() {
  for (const e of registry) e.obj.visible = entryVisible(e);
  requestRender();
}

   7. GEOMETRY BUILDERS — ARCHITECTURE (one function per element)
   Room: X 0..6 m along the back wall, Z 0..ROOM_DEPTH toward the viewer,
   floor at Y = 0, ceiling at Y = 2.70 m. Front and right walls are cut away.
   ===================================================================== */
function archMesh(geo, mat, layer, { cast = true, receive = true, edges = true, parent = world } = {}) {
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = cast; mesh.receiveShadow = receive;
  if (edges) {
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 30), archEdgeMat);
    e.raycast = () => {};
    e.userData.isEdge = true;
    mesh.add(e);
  }
  parent.add(mesh);
  tag(mesh, layer);
  return mesh;
}
const archBox = (layer, mat, b, opts) => archMesh(boxGeo(...b), mat, layer, opts);

/** Flat panel in the XY plane (extruded along Z) with an optional rectangular hole [x0,x1,y0,y1]. */
function panelWithHole(x0, x1, y0, y1, z0, z1, hole) {
  const s = new THREE.Shape();
  s.moveTo(x0, y0); s.lineTo(x1, y0); s.lineTo(x1, y1); s.lineTo(x0, y1); s.closePath();
  if (hole) {
    const h = new THREE.Path();
    h.moveTo(hole[0], hole[2]); h.lineTo(hole[0], hole[3]); h.lineTo(hole[1], hole[3]); h.lineTo(hole[1], hole[2]); h.closePath();
    s.holes.push(h);
  }
  const g = new THREE.ExtrudeGeometry(s, { depth: z1 - z0, bevelEnabled: false });
  g.translate(0, 0, z0);
  return g;
}

/* =====================================================================
   8. GEOMETRY BUILDERS — LED COMPONENTS
   Each assembly is built in a local frame: X = across the channel,
   Y = light direction (away from the mounting surface), Z = along the run.
   ===================================================================== */
function profileDims(P) {
  const s = MM;
  return {
    W: P.W * s, H: P.H * s, t: P.t * s, g: 0.5 * s,
    gy0: (P.H - 1.7) * s, gy1: (P.H - 0.4) * s,
    clipT: 0.7 * s, tapeW: P.tape * s, pcbT: 0.3 * s,
    chip: [2.8 * s, 0.8 * s, 3.5 * s],
    dome: (P.dome || 0) * s, capT: 1.6 * s, clipLen: 10 * s,
  };
}
/** U-channel with diffuser grooves. */
function shapeChannel(d) {
  const { W, H, t, g, gy0, gy1 } = d, o = W / 2, i = W / 2 - t;
  const s = new THREE.Shape();
  s.moveTo(-o, 0); s.lineTo(o, 0); s.lineTo(o, H); s.lineTo(i, H);
  s.lineTo(i, gy1); s.lineTo(i + g, gy1); s.lineTo(i + g, gy0); s.lineTo(i, gy0); s.lineTo(i, t);
  s.lineTo(-i, t); s.lineTo(-i, gy0); s.lineTo(-i - g, gy0); s.lineTo(-i - g, gy1); s.lineTo(-i, gy1);
  s.lineTo(-i, H); s.lineTo(-o, H); s.closePath();
  return s;
}
/** Flat or domed snap-in diffuser. */
function shapeDiffuser(d, P) {
  const a = d.W / 2 - d.t + d.g * 0.92, v0 = d.gy0 + 0.06 * MM, v1 = d.gy1 - 0.06 * MM;
  const s = new THREE.Shape();
  if (P.diffuser !== 'dome') {
    s.moveTo(-a, v0); s.lineTo(a, v0); s.lineTo(a, v1); s.lineTo(-a, v1); s.closePath();
    return s;
  }
  const c = d.W / 2 - d.t - 0.08 * MM;
  s.moveTo(-a, v0); s.lineTo(a, v0); s.lineTo(a, v1); s.lineTo(c, v1); s.lineTo(c, d.H);
  for (let k = 1; k < 24; k++) { const th = Math.PI * k / 24; s.lineTo(c * Math.cos(th), d.H + d.dome * Math.sin(th)); }
  s.lineTo(-c, d.H); s.lineTo(-c, v1); s.lineTo(-a, v1); s.closePath();
  return s;
}
/** Spring mounting clip (base plate with screw ears + side arms). */
function shapeClip(d) {
  const o = d.W / 2, e = 5 * MM, w = 0.7 * MM, ct = d.clipT, top = ct + 3.0 * MM, hook = 0.45 * MM;
  const s = new THREE.Shape();
  s.moveTo(-(o + e), 0); s.lineTo(o + e, 0); s.lineTo(o + e, ct); s.lineTo(o + w, ct); s.lineTo(o + w, top + w);
  s.lineTo(o - hook, top + w); s.lineTo(o - hook, top); s.lineTo(o, top); s.lineTo(o, ct); s.lineTo(-o, ct);
  s.lineTo(-o, top); s.lineTo(-o + hook, top); s.lineTo(-o + hook, top + w); s.lineTo(-(o + w), top + w);
  s.lineTo(-(o + w), ct); s.lineTo(-(o + e), ct); s.closePath();
  return s;
}
/** End-cap outline (channel silhouette + dome). */
function shapeCap(d) {
  const o = d.W / 2 + 0.25 * MM, top = d.H + 0.25 * MM;
  const s = new THREE.Shape();
  s.moveTo(-o, -0.2 * MM); s.lineTo(o, -0.2 * MM); s.lineTo(o, top);
  if (d.dome > 0) {
    const c = d.W / 2 - d.t + 0.3 * MM, dh = d.dome + 0.3 * MM;
    s.lineTo(c, top);
    for (let k = 1; k < 20; k++) { const th = Math.PI * k / 20; s.lineTo(c * Math.cos(th), top + dh * Math.sin(th)); }
    s.lineTo(-c, top);
  }
  s.lineTo(-o, top); s.closePath();
  return s;
}

const assemblies = [];                                        // every channel segment in the scene
const lightMats = { pcb: [], chip: [], diffuser: [], halo: [], wash: [], schemTape: [] };

/** One channel segment: clips + channel + tape + connectors + diffuser + end caps (+ glow halo, zone highlight). */
function buildAssembly(zone, seg, { connStart = false, connEnd = false } = {}) {
  const P = PROFILES[zone.profile], d = profileDims(P);
  const a = v3(seg.a), b = v3(seg.b), len = a.distanceTo(b);
  const zW = b.clone().sub(a).normalize();
  const yW = v3(seg.aim).normalize(); yW.addScaledVector(zW, -yW.dot(zW)).normalize();
  const xW = new THREE.Vector3().crossVectors(yW, zW);
  const root = new THREE.Group();
  root.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(xW, yW, zW));
  root.position.copy(a);
  world.add(root);

  // per-assembly material copies so a clipping plane affects only this assembly
  const mats = {
    channel: MAT.aluminum.clone(), clip: MAT.clip.clone(), cap: (P.sealed ? MAT.gasket : MAT.cap).clone(),
    diffuser: MAT.diffuser.clone(), pcb: MAT.pcb.clone(), chip: MAT.chip.clone(),
    connector: MAT.connector.clone(), contact: MAT.contact.clone(),
    halo: new THREE.MeshBasicMaterial({ map: falloffTexture(0.5, 0.36, 0.03), transparent: true, depthWrite: false, side: THREE.DoubleSide, opacity: 0.5 }),
    highlight: new THREE.MeshBasicMaterial({ color: zone.color, side: THREE.BackSide }),
  };
  lightMats.pcb.push(mats.pcb); lightMats.chip.push(mats.chip);
  lightMats.diffuser.push(mats.diffuser); lightMats.halo.push(mats.halo);

  const part = (name, layer, extra = {}) => {
    const g = new THREE.Group(); g.name = name; root.add(g);
    tag(g, layer, Object.assign({ zone: zone.id }, extra));
    return g;
  };
  const parts = {
    clips: part('clips', 'hardware'),
    channel: part('channel', 'channels'),
    caps: part('caps', 'hardware'),
    tape: part('tape', 'tape'),
    connectors: part('connectors', 'hardware'),
    diffuser: part('diffuser', 'diffusers'),
    halo: part('halo', 'tape', { glow: true }),
    highlight: part('highlight', 'highlight'),
  };
  const v0 = d.clipT;                                     // channel sits on the clip base plates
  const Htot = d.H + d.dome;

  // aluminum channel
  const chMesh = new THREE.Mesh(new THREE.ExtrudeGeometry(shapeChannel(d), { depth: len, bevelEnabled: false }), mats.channel);
  chMesh.position.y = v0; chMesh.castShadow = true; parts.channel.add(chMesh);

  // diffuser
  const dfMesh = new THREE.Mesh(new THREE.ExtrudeGeometry(shapeDiffuser(d, P), { depth: len, bevelEnabled: false }), mats.diffuser);
  dfMesh.position.y = v0; parts.diffuser.add(dfMesh);

  // LED tape: PCB + LED chips (60 LEDs/m)
  const inset = 2 * MM, tLen = Math.max(0.01, len - 2 * inset);
  const pcbMesh = new THREE.Mesh(new THREE.BoxGeometry(d.tapeW, d.pcbT, tLen), mats.pcb);
  pcbMesh.position.set(0, v0 + d.t + d.pcbT / 2, len / 2); parts.tape.add(pcbMesh);
  const n = Math.max(1, Math.floor(tLen / (1 / 60)));
  const chips = new THREE.InstancedMesh(new THREE.BoxGeometry(...d.chip), mats.chip, n);
  const m4 = new THREE.Matrix4();
  for (let k = 0; k < n; k++) { m4.makeTranslation(0, v0 + d.t + d.pcbT + d.chip[1] / 2, inset + (k + 0.5) * tLen / n); chips.setMatrixAt(k, m4); }
  chips.instanceMatrix.needsUpdate = true;
  parts.tape.add(chips);

  // mounting clips
  const clipGeo = new THREE.ExtrudeGeometry(shapeClip(d), { depth: d.clipLen, bevelEnabled: false });
  const nClips = Math.max(2, Math.round(len / 0.5) + 1), margin = Math.min(0.06, len * 0.12);
  for (let k = 0; k < nClips; k++) {
    const c = new THREE.Mesh(clipGeo, mats.clip);
    c.position.z = lerp(margin, len - margin - d.clipLen, k / (nClips - 1));
    parts.clips.add(c);
  }

  // end caps (gasketed on sealed profiles)
  const capGeo = new THREE.ExtrudeGeometry(shapeCap(d), { depth: d.capT, bevelEnabled: false });
  const capS = new THREE.Mesh(capGeo, mats.cap), capE = new THREE.Mesh(capGeo, mats.cap);
  capS.position.set(0, v0, -d.capT); capS.userData.baseZ = -d.capT; capS.userData.dir = -1;
  capE.position.set(0, v0, len); capE.userData.baseZ = len; capE.userData.dir = 1;
  parts.caps.add(capS, capE);

  // clamp-on connectors at fed / jumpered ends
  const connGeo = new THREE.BoxGeometry(11 * MM, 3.2 * MM, 13 * MM);
  const contactGeo = new THREE.BoxGeometry(7 * MM, 0.4 * MM, 4 * MM);
  const addConn = (z) => {
    const c = new THREE.Mesh(connGeo, mats.connector);
    c.position.set(0, v0 + d.t + d.pcbT + 1.6 * MM, z);
    const k = new THREE.Mesh(contactGeo, mats.contact); k.position.y = 1.8 * MM; c.add(k);
    parts.connectors.add(c);
  };
  if (connStart) addConn(inset + 6.5 * MM);
  if (connEnd) addConn(len - inset - 6.5 * MM);

  // soft glow halo just above the diffuser
  const hw = d.W * 3.4, yTop = v0 + Htot + 0.6 * MM;
  const halo = new THREE.Mesh(quadGeometry([-hw, yTop, 0], [0, 0, len], [2 * hw, 0, 0]), mats.halo);
  halo.renderOrder = 2; parts.halo.add(halo);

  // zone highlight (inverted hull outline in the zone color)
  const e = 1.4 * MM;
  const hl = new THREE.Mesh(boxGeo(-d.W / 2 - e, d.W / 2 + e, v0 - e, v0 + Htot + e, -d.capT - e, len + d.capT + e), mats.highlight);
  parts.highlight.add(hl);

  root.updateMatrixWorld(true);
  const wireV = v0 + d.t + 1.6 * MM;
  const as = {
    zone, seg, P, d, len, a, b, xW, yW, zW, root, parts, mats, v0, Htot,
    meshes: { channel: chMesh, diffuser: dfMesh, pcb: pcbMesh },
    clipMats: Object.values(mats),
    name: `${zone.code} ${zone.name} — ${seg.name}`,
    feedStart: root.localToWorld(new THREE.Vector3(0, wireV, -d.capT - 3 * MM)),
    feedEnd: root.localToWorld(new THREE.Vector3(0, wireV, len + d.capT + 3 * MM)),
    worldPoint(x, y, z) { return this.root.localToWorld(new THREE.Vector3(x, y, z)); },

}

/** Light pool on a nearby surface (only shown with glow on and its surface visible). */
function buildWash(zone, w) {
  const mat = new THREE.MeshBasicMaterial({
    map: falloffTexture(w.peak, w.sigma), transparent: true, depthWrite: false, side: THREE.DoubleSide,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
  });
  mat.userData.k = w.k;
  lightMats.wash.push(mat);
  const mesh = new THREE.Mesh(quadGeometry(w.o, w.u, w.v), mat);
  mesh.renderOrder = 1;
  mesh.raycast = () => {};
  world.add(mesh);
  tag(mesh, 'tape', { zone: zone.id, glow: true, requires: w.req ? [w.req] : null });
  return mesh;
}

/* =====================================================================
   9. GEOMETRY BUILDERS — POWER, CONTROLS, WIRING
   ===================================================================== */
/** Wire as a tube along a rounded orthogonal route. Returns { mesh, length, path }. */
function buildWire(points, { radius, color, layer, zone = null, bend = 0.035 }) {
  const path = roundedPath(points.map(v3), bend);
  const length = path.getLength();
  const geo = new THREE.TubeGeometry(path, Math.max(12, Math.ceil(length / 0.01)), radius, 8, false);
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.05 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  const capGeo = new THREE.SphereGeometry(radius * 1.15, 10, 8);
  [path.getPointAt(0), path.getPointAt(1)].forEach((p) => { const s = new THREE.Mesh(capGeo, mat); s.position.copy(p); mesh.add(s); });
  world.add(mesh);
  tag(mesh, layer, { zone });
  return { mesh, length, path };
}
const lineLegColor = (z) => new THREE.Color(z.color).lerp(new THREE.Color(COLORS.lineVoltage), 0.5);

/** LED driver / power supply box. pos = point on the mounting surface, normal = surface direction. */
function buildPowerSupply(z) {
  const p = z.psu, L = 0.22, T = 0.042, Wd = 0.07;
  const n = v3(p.normal).normalize();
  const xA = new THREE.Vector3(p.flip ? -1 : 1, 0, 0);
  const zA = new THREE.Vector3().crossVectors(xA, n);
  const g = new THREE.Group();
  g.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(xA, n, zA));
  g.position.copy(v3(p.pos));
  const add = (geo, mat, cast = true) => { const m = new THREE.Mesh(geo, mat); m.castShadow = cast; g.add(m); return m; };
  add(boxGeo(-L / 2, L / 2, 0.003, T, -Wd / 2, Wd / 2), MAT.psuBody);
  add(boxGeo(-L / 2 - 0.018, L / 2 + 0.018, 0, 0.003, -Wd * 0.3, Wd * 0.3), MAT.psuBody);         // mounting flange
  add(boxGeo(-L * 0.28, L * 0.3, T, T + 0.0012, -Wd * 0.36, Wd * 0.36), MAT.psuLabel, false);       // label plate
  add(boxGeo(-L * 0.28, -L * 0.16, T + 0.0012, T + 0.0018, -Wd * 0.36, Wd * 0.36), MAT.brand, false); // brand stripe
  add(boxGeo(L * 0.18, L * 0.26, -0.0005 + 0.003, T + 0.0015, -Wd / 2 - 0.0015, Wd / 2 + 0.0015), new THREE.MeshStandardMaterial({ color: z.color, roughness: 0.5 })); // zone band
  add(boxGeo(-L / 2 - 0.012, -L / 2, 0.006, T * 0.8, -Wd * 0.38, Wd * 0.38), MAT.terminal);
  add(boxGeo(L / 2, L / 2 + 0.012, 0.006, T * 0.8, -Wd * 0.38, Wd * 0.38), MAT.terminal);
  world.add(g);
  g.updateMatrixWorld(true);
  tag(g, 'psu', { zone: z.id });
  z.psuIn = g.localToWorld(new THREE.Vector3(-L / 2 - 0.014, T * 0.5, 0));
  z.psuOut = g.localToWorld(new THREE.Vector3(L / 2 + 0.014, T * 0.5, 0));
  z.psuTop = g.localToWorld(new THREE.Vector3(0, T, 0));
  z.psuGroup = g;
}

/** Multi-gang wall dimmer bank (one paddle per zone) on the left wall. */
function buildDimmerBank() {
  const n = ZONES.length, { x, y, zc, pitch } = DIMMER_BANK, half = (n * pitch) / 2 + 0.018;
  const plate = new THREE.Mesh(boxGeo(x, x + 0.006, y - 0.066, y + 0.066, zc - half, zc + half), MAT.plate);
  plate.castShadow = true; world.add(plate); tag(plate, 'dimmers');
  const box = new THREE.Mesh(boxGeo(x - 0.09, x - 0.002, y - 0.072, y + 0.072, zc - half + 0.01, zc + half - 0.01), MAT.wallBox);
  world.add(box); tag(box, 'dimmers');
  ZONES.forEach((z, k) => {
    const zk = zc + (k - (n - 1) / 2) * pitch;
    z.dimmerZ = zk;
    const g = new THREE.Group();
    const paddle = new THREE.Mesh(boxGeo(x + 0.006, x + 0.013, y - 0.042, y + 0.042, zk - 0.0165, zk + 0.0165), MAT.plate);
    paddle.castShadow = true;
    const led = new THREE.Mesh(boxGeo(x + 0.013, x + 0.0145, y - 0.03, y + 0.03, zk + 0.0105, zk + 0.0138), new THREE.MeshBasicMaterial({ color: z.color }));
    g.add(paddle, led);
    world.add(g);
    tag(g, 'dimmers', { zone: z.id });
    z.dimmerOut = new THREE.Vector3(x - 0.045, y + 0.072, zk);
    z.dimmerPos = new THREE.Vector3(x + 0.013, y, zk);
  });
  DIMMER_BANK.center = new THREE.Vector3(x + 0.006, y + 0.066, zc);
}

/** Breaker panel with dead-front and breaker handles (lighting breaker in accent color). */
function buildBreakerPanel() {
  const [x0, x1, y0, y1, z0, z1] = BREAKER.box;
  const g = new THREE.Group();
  const body = new THREE.Mesh(boxGeo(x0, x1, y0, y1, z0, z1), MAT.panel); body.castShadow = true; g.add(body);
  const front = new THREE.Mesh(boxGeo(x0 + 0.03, x1 - 0.03, y0 + 0.06, y1 - 0.05, z1, z1 + 0.003), MAT.plate); g.add(front);
  for (let r = 0; r < 8; r++) for (let c = 0; c < 2; c++) {
    const bx = (x0 + x1) / 2 + (c ? 0.03 : -0.07), by = y1 - 0.1 - r * 0.062;
    const mat = (r === 2 && c === 0) ? MAT.accent : MAT.breaker;
    g.add(new THREE.Mesh(boxGeo(bx, bx + 0.04, by - 0.012, by + 0.012, z1 + 0.003, z1 + 0.012), mat));
  }
  world.add(g);
  tag(g, 'panel');
  BREAKER.top = new THREE.Vector3((x0 + x1) / 2, y1, (z0 + z1) / 2);
  BREAKER.front = new THREE.Vector3((x0 + x1) / 2, (y0 + y1) / 2 + 0.15, z1 + 0.01);
}

/* =====================================================================
   10. SYSTEM BUILD — turns ZONES data into geometry
   ===================================================================== */
function buildZone(z) {
  z.assemblies = [];
  z.runs.forEach((run) => {
    const last = run.segments.length - 1;
    run.assemblies = run.segments.map((seg, si) => buildAssembly(z, seg, {
      connStart: (si === 0 && run.feed === 'start') || si > 0,
      connEnd: (si === last && run.feed === 'end') || si < last,
    }));
    z.assemblies.push(...run.assemblies);
    // jumpers between consecutive segments
    for (let i = 0; i < last; i++) {
      const A = run.assemblies[i], B = run.assemblies[i + 1];
      const pA = A.feedEnd, pB = B.feedStart, mid = pA.clone().add(pB).multiplyScalar(0.5);
      const curve = new THREE.CatmullRomCurve3([pA, pA.clone().addScaledVector(A.zW, 0.008).addScaledVector(A.yW, 0.008), mid.clone().addScaledVector(A.yW, 0.022), pB.clone().addScaledVector(B.zW, -0.008).addScaledVector(B.yW, 0.008), pB]);
      const jm = new THREE.Mesh(new THREE.TubeGeometry(curve, 40, WIRE_RADIUS.lv * 0.6, 8, false), new THREE.MeshStandardMaterial({ color: z.color, roughness: 0.45 }));
      world.add(jm);
      tag(jm, 'hardware', { zone: z.id });
    }
    run.feedPoint = run.feed === 'start' ? run.assemblies[0].feedStart : run.assemblies[last].feedEnd;
  });
  z.totalLen = z.assemblies.reduce((s, a) => s + a.len, 0);
  (z.washes || []).forEach((w) => buildWash(z, w));
  buildPowerSupply(z);
  // line voltage: dimmer -> power supply input
  const linePts = [z.dimmerOut, ...z.lineRoute.map((p) => v3(p.map((c) => (c === 'DZ' ? z.dimmerZ : c)))), z.psuIn];
  z.lineWire = buildWire(linePts, { radius: WIRE_RADIUS.line, color: lineLegColor(z), layer: 'wire-line', zone: z.id });
  // low voltage: power supply output -> each run's feed end
  z.lvWires = z.runs.map((run, ri) => buildWire([z.psuOut, ...(z.lvRoutes[ri] || []).map(v3), run.feedPoint],
    { radius: WIRE_RADIUS.lv, color: z.color, layer: 'wire-lv', zone: z.id, bend: 0.025 }));
}

function buildSystem() {
  LAYERS.forEach((l) => l.build && l.build());
  buildDimmerBank();
  buildBreakerPanel();
  ZONES.forEach(buildZone);
  BREAKER.feedWire = buildWire(BREAKER.feedRoute, { radius: WIRE_RADIUS.line, color: COLORS.lineVoltage, layer: 'wire-line' });
}

/* =====================================================================
   11. LABELS, CALLOUTS & DIMENSIONS
   Drawn on a 2D canvas over the WebGL view (crisp text, leader lines,
   automatic de-overlap). The same drawing code runs at export scale, so
   labels are included in PNG exports.
   Label kinds: callout (box + leader), wire (pill tag), dim (dimension
   line), text (diagram text), detail (exploded/section part callouts).
   ===================================================================== */
const labels = [];
function addLabel(l) { const o = Object.assign({ kind: 'callout', space: '3d' }, l); labels.push(o); return o; }
/** True when the camera is zoomed in on the exploded / cross-section assembly: room-scale labels are hidden. */
function detailFocus() {
  return state.mode === '3d' && (state.explode > 0.02 || state.section) && rig.camera === perspCam &&
    rig.target.distanceTo(cutPoint(selectedAssembly())) < 0.6 && rig.radius < 1.2;
}
function labelVisible(l) {
  if (l.space !== (state.mode === 'schem' ? 'schem' : '3d')) return false;
  if (l.space === '3d' && l.kind !== 'detail' && !l.detailDim && detailFocus()) return false;
  if (l.layer && !layerOn[l.layer]) return false;
  if (l.zone && !zoneOn[resolve(l.zone)]) return false;
  if (l.requires && !l.requires.every((id) => layerOn[id])) return false;
  if (l.requiresAny && !l.requiresAny.some((id) => layerOn[id])) return false;
  if (l.when && !l.when()) return false;
  return true;
}
const LABEL_THEMES = {
  light: { box: 'rgba(255,255,255,0.97)', border: 'rgba(25,35,45,0.16)', title: '#1b222b', sub: '#5b6572', leader: '#5b6572', dim: '#3f4955', shadow: 'rgba(20,30,40,0.14)', text: '#1b222b', muted: '#5b6572' },
  dark:  { box: 'rgba(33,39,47,0.96)',   border: 'rgba(255,255,255,0.16)', title: '#f2f4f7', sub: '#a9b3bf', leader: '#c3cbd5', dim: '#c3cbd5', shadow: 'rgba(0,0,0,0.35)', text: '#eef1f4', muted: '#a9b3bf' },
};
const INK = { text: '#1b222b', muted: '#5b6572' };       // text inside white diagram blocks
const currentTheme = () => (BACKGROUNDS[state.bg] || BACKGROUNDS.light).theme;
const _pv = new THREE.Vector3();

function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function measureLabel(ctx, l, S) {
  const F = BRAND.font, title = resolve(l.title) || '', sub = resolve(l.sub) || '';
  if (l.kind === 'wire') {
    const fs = 10.5 * S; ctx.font = `600 ${fs}px ${F}`;
    return { w: ctx.measureText(title).width + 24 * S, h: fs + 10 * S, fs, title, sub: '' };
  }
  const fs1 = 12.5 * S, fs2 = 10.5 * S, padX = 9 * S, padY = 6 * S, bar = 4 * S;
  ctx.font = `600 ${fs1}px ${F}`; const tw = ctx.measureText(title).width;
  let sw = 0; if (sub) { ctx.font = `400 ${fs2}px ${F}`; sw = ctx.measureText(sub).width; }
  return { w: Math.max(tw, sw) + padX * 2 + bar, h: padY * 2 + fs1 * 1.2 + (sub ? fs2 * 1.35 : 0), fs1, fs2, padX, padY, bar, title, sub };
}
function drawLabelBox(ctx, b, th, S) {
  const F = BRAND.font, m = b.m;
  if (b.l.kind === 'wire') {
    roundRect(ctx, b.x, b.y, b.w, b.h, b.h / 2);
    ctx.fillStyle = th.box; ctx.fill();
    ctx.lineWidth = 1.5 * S; ctx.strokeStyle = b.color; ctx.stroke();
    ctx.beginPath(); ctx.arc(b.x + 9 * S, b.y + b.h / 2, 3 * S, 0, Math.PI * 2); ctx.fillStyle = b.color; ctx.fill();
    ctx.font = `600 ${m.fs}px ${F}`; ctx.fillStyle = th.title; ctx.textBaseline = 'middle';
    ctx.fillText(m.title, b.x + 16 * S, b.y + b.h / 2 + 0.5 * S);
    return;
  }
  const r = 6 * S;
  ctx.save();
  ctx.shadowColor = th.shadow; ctx.shadowBlur = 8 * S; ctx.shadowOffsetY = 1.5 * S;
  roundRect(ctx, b.x, b.y, b.w, b.h, r); ctx.fillStyle = th.box; ctx.fill();
  ctx.restore();
  ctx.save(); roundRect(ctx, b.x, b.y, b.w, b.h, r); ctx.clip();
  ctx.fillStyle = b.color; ctx.fillRect(b.x, b.y, m.bar, b.h);
  ctx.restore();
  roundRect(ctx, b.x, b.y, b.w, b.h, r); ctx.lineWidth = 1 * S; ctx.strokeStyle = th.border; ctx.stroke();
  ctx.textBaseline = 'top';
  ctx.font = `600 ${m.fs1}px ${F}`; ctx.fillStyle = th.title;
  ctx.fillText(m.title, b.x + m.bar + m.padX, b.y + m.padY);
  if (m.sub) { ctx.font = `400 ${m.fs2}px ${F}`; ctx.fillStyle = th.sub; ctx.fillText(m.sub, b.x + m.bar + m.padX, b.y + m.padY + m.fs1 * 1.2 + 1 * S); }
}
function drawLeader(ctx, b, th, S) {
  if (!b.A) return;
  const A = b.A, cy = b.y + b.h / 2;
  let ex, ey;
  if (A.x < b.x) { ex = b.x; ey = cy; } else if (A.x > b.x + b.w) { ex = b.x + b.w; ey = cy; } else { ex = A.x; ey = A.y < b.y ? b.y : b.y + b.h; }
  ctx.strokeStyle = th.leader; ctx.lineWidth = 1.25 * S;
  ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.beginPath(); ctx.arc(A.x, A.y, 3.2 * S, 0, Math.PI * 2);
  ctx.fillStyle = b.color; ctx.fill(); ctx.lineWidth = 1.5 * S; ctx.strokeStyle = th.box; ctx.stroke();
}
function resolveOverlaps(boxes, w, h, pad) {
  const overlap = (a, b) => a.x < b.x + b.w + pad && a.x + a.w + pad > b.x && a.y < b.y + b.h + pad && a.y + a.h + pad > b.y;
  for (let pass = 0; pass < 5; pass++) {
    boxes.sort((a, b) => a.y - b.y);
    let moved = false;
    for (let i = 0; i < boxes.length; i++) for (let j = 0; j < i; j++) {
      if (overlap(boxes[i], boxes[j])) { boxes[i].y = boxes[j].y + boxes[j].h + pad; moved = true; }
    }
    boxes.forEach((b) => { b.x = clamp(b.x, 4, Math.max(4, w - b.w - 4)); b.y = clamp(b.y, 4, Math.max(4, h - b.h - 4)); });
    if (!moved) break;

}
function drawDimension(ctx, l, proj, th, S) {
  const a = v3(resolve(l.a)), b = v3(resolve(l.b)), off = v3(resolve(l.off) || [0, 0, 0]);
  const pa = proj(a), pb = proj(b), pA = proj(a.clone().add(off)), pB = proj(b.clone().add(off));
  if (!pa || !pb || !pA || !pB) return;
  const dx = pB.x - pA.x, dy = pB.y - pA.y, L = Math.hypot(dx, dy);
  if (L < 14 * S) return;
  const ux = dx / L, uy = dy / L;
  ctx.strokeStyle = th.dim; ctx.lineWidth = 1 * S;
  // extension lines (with a small overshoot)
  [[pa, pA], [pb, pB]].forEach(([p, q]) => {
    const ex = q.x - p.x, ey = q.y - p.y, el = Math.hypot(ex, ey) || 1;
    ctx.beginPath(); ctx.moveTo(p.x + ex / el * 3 * S, p.y + ey / el * 3 * S); ctx.lineTo(q.x + ex / el * 5 * S, q.y + ey / el * 5 * S); ctx.stroke();
  });

  ctx.lineWidth = 1.2 * S;
  ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.stroke();
  const t = 5 * S, tx = (ux - uy) * 0.7071 * t, ty = (uy + ux) * 0.7071 * t;
  ctx.lineWidth = 1.8 * S;
  [pA, pB].forEach((p) => { ctx.beginPath(); ctx.moveTo(p.x - tx, p.y - ty); ctx.lineTo(p.x + tx, p.y + ty); ctx.stroke(); });
  // value
  const text = resolve(l.text) || fmtLen(a.distanceTo(b));
  const fs = 11 * S; ctx.font = `600 ${fs}px ${BRAND.font}`;
  const tw = ctx.measureText(text).width + 12 * S, thh = fs + 8 * S;
  const mx = (pA.x + pB.x) / 2, my = (pA.y + pB.y) / 2;
  roundRect(ctx, mx - tw / 2, my - thh / 2, tw, thh, 4 * S); ctx.fillStyle = th.box; ctx.fill();
  ctx.lineWidth = 1 * S; ctx.strokeStyle = th.dim; ctx.stroke();
  ctx.fillStyle = th.title; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  ctx.fillText(text, mx, my + 0.5 * S); ctx.textAlign = 'left';
}
function drawDiagramText(ctx, l, proj, th, h, cam) {
  const p = proj(v3(resolve(l.anchor))); if (!p) return;
  const ppu = h / ((cam.top - cam.bottom) / cam.zoom);
  const fs = l.worldSize * ppu; if (fs < 3) return;
  ctx.font = `${l.weight || 400} ${fs}px ${BRAND.font}`;
  ctx.fillStyle = l.ink ? (l.muted ? INK.muted : INK.text) : (l.muted ? th.muted : th.text);
  if (l.color) ctx.fillStyle = resolve(l.color);

  ctx.fillText(resolve(l.text), p.x, p.y);

}

/** Draw every visible label for the given camera. Units: CSS pixels (ctx is pre-scaled). */
function drawOverlay(ctx, w, h, cam) {
  const th = LABEL_THEMES[currentTheme()], S = state.labelScale;
  cam.updateMatrixWorld();
  const proj = (p) => {
    _pv.copy(p).project(cam);
    if (_pv.z > 1 || _pv.z < -1) return null;
    return { x: (_pv.x + 1) / 2 * w, y: (1 - _pv.y) / 2 * h };

  const vis = labels.filter(labelVisible);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  vis.filter((l) => l.kind === 'dim').forEach((l) => drawDimension(ctx, l, proj, th, S));
  vis.filter((l) => l.kind === 'text').forEach((l) => drawDiagramText(ctx, l, proj, th, h, cam));

  // callouts + wire tags
  const boxes = [];
  vis.filter((l) => l.kind === 'callout' || l.kind === 'wire').forEach((l) => {
    const anchor = v3(resolve(l.anchor)), A = proj(anchor);
    if (!A || A.x < -40 || A.x > w + 40 || A.y < -40 || A.y > h + 40) return;
    const m = measureLabel(ctx, l, S), color = resolve(l.color) || BRAND.primary;
    let x, y;

    else {
      const L = proj(anchor.clone().add(v3(resolve(l.offset) || [0, 0.3, 0]))) || { x: A.x + 60, y: A.y - 40 };
      x = L.x >= A.x ? L.x : L.x - m.w; y = L.y - m.h / 2;
    }
    boxes.push({ l, m, x, y, w: m.w, h: m.h, A: l.kind === 'wire' ? null : A, color });

  boxes.forEach((b) => drawLeader(ctx, b, th, S));
  boxes.forEach((b) => drawLabelBox(ctx, b, th, S));

  // exploded / section detail callouts: column beside the assembly
  const det = vis.filter((l) => l.kind === 'detail').map((l) => ({ l, A: proj(v3(resolve(l.anchor))) })).filter((o) => o.A && o.A.x > -20 && o.A.x < w + 20 && o.A.y > -20 && o.A.y < h + 20);
  if (det.length) {
    const ms = det.map((o) => measureLabel(ctx, o.l, S));
    const maxW = Math.max(...ms.map((m) => m.w));
    const ax = det.map((o) => o.A.x), gap = 70 * S;
    const rightRoom = w - 8 - (Math.max(...ax) + gap), leftRoom = Math.min(...ax) - gap - 8;
    const left = rightRoom < maxW && leftRoom > rightRoom;
    const colX = left ? Math.max(8, Math.min(...ax) - gap - maxW) : Math.min(Math.max(...ax) + gap, w - 8 - maxW);
    const dboxes = det.map((o, i) => ({ l: o.l, m: ms[i], A: o.A, x: left ? colX + maxW - ms[i].w : colX, y: o.A.y - ms[i].h / 2, w: ms[i].w, h: ms[i].h, color: resolve(o.l.color) || BRAND.primary }));
    dboxes.sort((a, b) => a.A.y - b.A.y);
    for (let i = 1; i < dboxes.length; i++) dboxes[i].y = Math.max(dboxes[i].y, dboxes[i - 1].y + dboxes[i - 1].h + 6 * S);
    const shift = (dboxes.reduce((s, b) => s + b.A.y, 0) - dboxes.reduce((s, b) => s + b.y + b.h / 2, 0)) / dboxes.length;
    dboxes.forEach((b) => { b.y = clamp(b.y + shift, 4, h - b.h - 4); });
    dboxes.forEach((b) => drawLeader(ctx, b, th, S));
    dboxes.forEach((b) => drawLabelBox(ctx, b, th, S));
  }
}

/* =====================================================================
   12. LIGHTING STATE — glow, brightness (emissive strength), CCT, dim
   ===================================================================== */
function updateLighting() {
  const cct = new THREE.Color(CCT_COLORS[state.cct]), white = new THREE.Color(1, 1, 1);
  const I = glowActive() ? state.brightness * state.dim : 0;
  lightMats.chip.forEach((m) => { m.emissive.copy(cct).lerp(white, 0.3); m.emissiveIntensity = 1.6 * I; });
  lightMats.pcb.forEach((m) => { m.emissive.copy(cct); m.emissiveIntensity = 0.6 * I; });
  lightMats.diffuser.forEach((m) => { m.emissive.copy(white).lerp(cct, 0.72); m.emissiveIntensity = Math.min(1.15, 0.95 * I); });
  lightMats.halo.forEach((m) => { m.color.copy(cct).lerp(white, 0.15); m.opacity = clamp(0.55 * I, 0, 0.95); });
  lightMats.wash.forEach((m) => { m.color.copy(cct); m.opacity = clamp(0.62 * m.userData.k * I, 0, 0.95); });
  const off = new THREE.Color(COLORS.chip), gray = new THREE.Color('#a7aeb7');
  lightMats.schemTape.forEach((m) => {
    if (I <= 0) m.color.copy(off);
    else m.color.copy(cct).lerp(white, 0.1).lerp(gray, (1 - Math.min(1, I)) * 0.65);
  });
  applyVisibility();
}

/* =====================================================================
   13. EXPLODED VIEW & CROSS-SECTION (selected assembly only)
   ===================================================================== */
function setAssemblyExplode(as, t) {
  const d = t * EXPLODE_STEP, P = as.parts;
  P.clips.position.y = d;
  P.channel.position.y = P.highlight.position.y = P.caps.position.y = 2 * d;
  P.caps.children.forEach((c) => { c.position.z = c.userData.baseZ + c.userData.dir * d; });
  P.tape.position.y = P.connectors.position.y = 3 * d;
  P.diffuser.position.y = P.halo.position.y = 4 * d;
}
function applyExplode() {
  const sel = selectedAssembly();
  assemblies.forEach((as) => setAssemblyExplode(as, as === sel ? state.explode : 0));
  updateSectionPlane();
  requestRender();
}

const sectionPlane = new THREE.Plane();
const section = { as: null, caps: [], stencils: [], helper: null };
const SECTION_FILL = { channel: COLORS.sectionCut, diffuser: '#fbfbfb', pcb: '#eadfbf' };
const cutPoint = (as) => as.a.clone().addScaledVector(as.zW, as.len * state.cutPos);

function clearSection() {
  if (section.as) section.as.clipMats.forEach((m) => { m.clippingPlanes = null; m.needsUpdate = true; });
  section.stencils.forEach((o) => o.parent && o.parent.remove(o));
  section.caps.forEach((o) => { world.remove(o); untag(o); });
  if (section.helper) { world.remove(section.helper); untag(section.helper); }
  Object.assign(section, { as: null, caps: [], stencils: [], helper: null });
}
/** Clip the selected assembly with a plane across its length and fill the cut faces (stencil capping). */
function applySection() {
  clearSection();
  if (!state.section) { applyVisibility(); return; }
  const as = selectedAssembly();
  section.as = as;
  as.clipMats.forEach((m) => { m.clippingPlanes = [sectionPlane]; m.needsUpdate = true; });
  [['channel', 'channels'], ['diffuser', 'diffusers'], ['pcb', 'tape']].forEach(([key, layer], i) => {
    const mesh = as.meshes[key], ro = 20 + i * 3;
    const base = { depthWrite: false, depthTest: false, colorWrite: false, stencilWrite: true, stencilFunc: THREE.AlwaysStencilFunc, clippingPlanes: [sectionPlane] };
    const back = new THREE.MeshBasicMaterial(Object.assign({ side: THREE.BackSide, stencilFail: THREE.IncrementWrapStencilOp, stencilZFail: THREE.IncrementWrapStencilOp, stencilZPass: THREE.IncrementWrapStencilOp }, base));
    const front = new THREE.MeshBasicMaterial(Object.assign({ side: THREE.FrontSide, stencilFail: THREE.DecrementWrapStencilOp, stencilZFail: THREE.DecrementWrapStencilOp, stencilZPass: THREE.DecrementWrapStencilOp }, base));
    const m0 = new THREE.Mesh(mesh.geometry, back), m1 = new THREE.Mesh(mesh.geometry, front);
    m0.renderOrder = m1.renderOrder = ro;
    m0.raycast = m1.raycast = () => {};
    mesh.add(m0, m1);
    section.stencils.push(m0, m1);
    const capMat = new THREE.MeshStandardMaterial({
      color: SECTION_FILL[key], metalness: key === 'channel' ? 0.35 : 0, roughness: 0.6, side: THREE.DoubleSide,
      stencilWrite: true, stencilRef: 0, stencilFunc: THREE.NotEqualStencilFunc,
      stencilFail: THREE.ReplaceStencilOp, stencilZFail: THREE.ReplaceStencilOp, stencilZPass: THREE.ReplaceStencilOp,
    });
    const cap = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.6), capMat);
    cap.renderOrder = ro + 1;
    cap.raycast = () => {};
    cap.onAfterRender = (r) => r.clearStencil();
    world.add(cap);
    tag(cap, layer, { zone: as.zone.id });
    section.caps.push(cap);
  });
  // on-screen helper: outline of the cutting plane (hidden by "Hide UI for capture")
  const s = Math.max(as.d.W, as.Htot) * 0.95;
  const g = new THREE.BufferGeometry().setFromPoints([[-s, -s], [s, -s], [s, s], [-s, s], [-s, -s]].map(([x, y]) => new THREE.Vector3(x, y, 0)));
  const helper = new THREE.Line(g, new THREE.LineBasicMaterial({ color: BRAND.primary, transparent: true, opacity: 0.85, depthTest: false }));
  helper.renderOrder = 50;
  helper.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(as.xW, as.yW, as.zW));
  world.add(helper);
  tag(helper, null, { helper: true, when: () => state.mode === '3d' });
  section.helper = helper;
  updateSectionPlane();
  applyVisibility();
}
function updateSectionPlane() {
  const as = section.as; if (!as) return;
  const C = cutPoint(as);
  sectionPlane.setFromNormalAndCoplanarPoint(as.zW.clone().negate(), C);
  section.caps.forEach((c) => { c.position.copy(C); c.lookAt(C.clone().sub(sectionPlane.normal)); });
  if (section.helper) section.helper.position.copy(C).addScaledVector(as.yW, as.v0 + as.Htot / 2 + 2 * state.explode * EXPLODE_STEP).addScaledVector(as.zW, 0.0006);
  requestRender();
}

/* =====================================================================
   14. FLAT SYSTEM DIAGRAM (orthographic one-line schematic)
   breaker -> dimmer -> power supply -> tape, one row per zone.
   Uses the same layer & zone toggles as the 3D model.
   ===================================================================== */
const SCHEM = { rowH: 1.55, colBreaker: -8.3, colDim: -3.9, colPsu: 0.7, tapeX0: 4.2, tapeX1: 9.7 };
const sMat = (color) => new THREE.MeshBasicMaterial({ color });
function rrectGeo(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return new THREE.ShapeGeometry(s, 6);
}
function sAdd(obj, layer, zone = null, extra = {}) { schemRoot.add(obj); tag(obj, layer, Object.assign({ zone }, extra)); return obj; }
function sBlock(cx, cy, w, h, border, layer, zone) {
  const g = new THREE.Group();
  const outer = new THREE.Mesh(rrectGeo(w, h, 0.16), sMat(border));
  const inner = new THREE.Mesh(rrectGeo(w - 0.09, h - 0.09, 0.12), sMat('#ffffff'));
  inner.position.z = 0.01; g.add(outer, inner);
  g.position.set(cx, cy, 0);
  return sAdd(g, layer, zone);
}
function sPolyline(pts, width, color, layer, zone, arrow = false) {
  const g = new THREE.Group(), mat = sMat(color);
  for (let i = 0; i < pts.length - 1; i++) {
    const [x0, y0] = pts[i], [x1, y1] = pts[i + 1], len = Math.hypot(x1 - x0, y1 - y0);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(len + width, width), mat);
    m.position.set((x0 + x1) / 2, (y0 + y1) / 2, 0); m.rotation.z = Math.atan2(y1 - y0, x1 - x0);
    g.add(m);
  }
  if (arrow) {
    const [x0, y0] = pts[pts.length - 2], [x1, y1] = pts[pts.length - 1], a = Math.atan2(y1 - y0, x1 - x0), s = width * 2.6;
    const tri = new THREE.Shape(); tri.moveTo(0, 0); tri.lineTo(-s * 1.4, s); tri.lineTo(-s * 1.4, -s); tri.closePath();
    const t = new THREE.Mesh(new THREE.ShapeGeometry(tri), mat);
    t.position.set(x1, y1, 0.005); t.rotation.z = a; g.add(t);
  }
  g.position.z = -0.05;
  return sAdd(g, layer, zone);
}
function sText(x, y, text, size, extra = {}) {
  return addLabel(Object.assign({ kind: 'text', space: 'schem', anchor: [x, y, 0.2], text, worldSize: size }, extra));
}

function buildSchematic() {
  const S = SCHEM, n = ZONES.length, top = (n - 1) / 2 * S.rowH, rows = ZONES.map((z, i) => top - i * S.rowH);
  const LINE = COLORS.lineVoltage, wLine = 0.075, wLV = 0.06;
  const hdrY = top + 1.0;
  [['SOURCE', S.colBreaker], ['CONTROL', S.colDim], ['POWER', S.colPsu], ['LIGHTING', (S.tapeX0 + S.tapeX1) / 2]].forEach(([t, x]) =>
    sText(x, hdrY, t, 0.2, { weight: 700, muted: true, layer: 'labels-callouts' }));

  // breaker panel
  const bh = n * S.rowH - 0.3, bw = 2.3;
  sBlock(S.colBreaker, 0, bw, bh, '#3a4049', 'panel', null);
  sText(S.colBreaker, bh / 2 - 0.42, BREAKER.label, 0.25, { weight: 700, ink: true, layer: 'panel' });
  sText(S.colBreaker, bh / 2 - 0.78, '120V AC', 0.19, { ink: true, muted: true, layer: 'panel' });
  for (let k = -3; k <= 3; k++) {
    const accent = k === 0;
    const hnd = new THREE.Mesh(rrectGeo(0.62, 0.2, 0.05), sMat(accent ? BRAND.accent : '#3a4049'));
    hnd.position.set(S.colBreaker - 0.2, -k * 0.38 - 0.2, 0.03);
    sAdd(hnd, 'panel');
  }
  sText(S.colBreaker + 0.42, -0.2, '15A', 0.2, { weight: 700, ink: true, align: 'left', layer: 'panel' });

  // feed bus
  const busX = S.colBreaker + bw / 2 + 0.7, dimL = S.colDim - 1.0;
  sPolyline([[S.colBreaker + bw / 2, -0.2], [busX, -0.2]], wLine, LINE, 'wire-line');
  sPolyline([[busX, rows[0]], [busX, rows[n - 1]]], wLine, LINE, 'wire-line');
  sText((S.colBreaker + bw / 2 + busX) / 2 + 0.05, 0.12, BREAKER.gauge, 0.15, { muted: true, layer: 'labels-wires', requires: ['wire-line'] });

  ZONES.forEach((z, i) => {
    const y = rows[i], P = PROFILES[z.profile];
    // branch from bus to dimmer
    sPolyline([[busX, y], [dimL, y]], wLine, LINE, 'wire-line', z.id, true);
    const dot = new THREE.Mesh(new THREE.CircleGeometry(0.085, 16), sMat(LINE)); dot.position.set(busX, y, 0.02); sAdd(dot, 'wire-line', z.id);
    // dimmer
    sBlock(S.colDim, y, 2.0, 1.0, z.color, 'dimmers', z.id);
    sText(S.colDim, y + 0.17, `${z.code} Dimmer`, 0.23, { weight: 700, ink: true, layer: 'dimmers', zone: z.id });
    sText(S.colDim, y - 0.19, z.dimmer.type, 0.18, { ink: true, muted: true, layer: 'dimmers', zone: z.id });
    // switched leg (line voltage) dimmer -> PSU
    const legX0 = S.colDim + 1.0, legX1 = S.colPsu - 1.15;
    sPolyline([[legX0, y], [legX1, y]], wLine, lineLegColor(z).getStyle(), 'wire-line', z.id, true);
    sText((legX0 + legX1) / 2, y + 0.24, `${z.gauge.line} · 120V`, 0.15, { muted: true, layer: 'labels-wires', zone: z.id, requires: ['wire-line'] });
    sText((legX0 + legX1) / 2, y - 0.24, fmtApprox(z.lineWire.length), 0.15, { muted: true, layer: 'labels-wires', zone: z.id, requires: ['wire-line'] });
    // power supply
    sBlock(S.colPsu, y, 2.3, 1.0, z.color, 'psu', z.id);
    sText(S.colPsu, y + 0.17, `${z.code} Power supply`, 0.22, { weight: 700, ink: true, layer: 'psu', zone: z.id });
    sText(S.colPsu, y - 0.19, `${z.psu.watts} · ${z.psu.volts}`, 0.18, { ink: true, muted: true, layer: 'psu', zone: z.id });
    // low voltage PSU -> tape
    const lvX0 = S.colPsu + 1.15, lvX1 = S.tapeX0 - 0.08;
    sPolyline([[lvX0, y], [lvX1, y]], wLV, z.color, 'wire-lv', z.id, true);
    const lvLen = z.lvWires.reduce((m, w) => Math.max(m, w.length), 0);
    sText((lvX0 + lvX1) / 2, y + 0.24, `${z.gauge.lv}`, 0.15, { muted: true, layer: 'labels-wires', zone: z.id, requires: ['wire-lv'] });
    sText((lvX0 + lvX1) / 2, y - 0.24, `24V DC · ${fmtApprox(lvLen)}`, 0.15, { muted: true, layer: 'labels-wires', zone: z.id, requires: ['wire-lv'] });
    // channel + tape + end caps

/* =====================================================================
   15. CAMERA PRESETS & SAVED VIEWS
   A "view" = { mode, type, target, theta, phi, radius, zoom, fov }
   ===================================================================== */
const rig = new OrbitRig(glCanvas);
let tween = null;
let stashed3DView = null;

function getView() {
  const cam = rig.camera;
  return {
    mode: state.mode, type: cam.isPerspectiveCamera ? 'persp' : 'ortho',
    target: rig.target.toArray(), theta: rig.theta, phi: rig.phi, radius: rig.radius,
    zoom: cam.zoom, fov: perspCam.fov,
  };
}
function setFov(fov) { state.fov = fov; perspCam.fov = fov; perspCam.updateProjectionMatrix(); }
function setView(v) {
  tween = null;
  const mode = v.mode || '3d';
  if (mode !== state.mode) setMode(mode, { keepView: true });
  if (mode === 'schem') {
    rig.camera = schemCam; rig.target.fromArray(v.target); rig.theta = 0; rig.phi = Math.PI / 2; rig.radius = 10;
    schemCam.zoom = v.zoom || 1; schemCam.updateProjectionMatrix();
  } else {
    const cam = v.type === 'ortho' ? orthoCam : perspCam;
    rig.camera = cam;
    rig.target.fromArray(v.target); rig.theta = v.theta; rig.phi = v.phi;
    rig.radius = v.type === 'ortho' ? 30 : (v.radius || 8);
    if (v.type === 'ortho') { cam.zoom = v.zoom || 1; cam.updateProjectionMatrix(); }
    else if (v.fov) setFov(v.fov);
  }
  rig.update();
  syncUI();
}
function animateTo(v, ms = 650) {
  const cam = (v.mode || '3d') === 'schem' ? schemCam : (v.type === 'ortho' ? orthoCam : perspCam);
  if ((v.mode || '3d') !== state.mode || cam !== rig.camera || ms <= 0) { setView(v); return; }
  const from = getView();
  let dT = v.theta - from.theta;
  dT = (((dT + Math.PI) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
  tween = { t0: performance.now(), ms, from, to: v, dT };
}
function stepTween(now) {
  const { from: f, to: t, dT } = tween, k = easeInOut(clamp((now - tween.t0) / tween.ms, 0, 1));
  rig.target.fromArray(f.target).lerp(v3(t.target), k);
  rig.theta = f.theta + dT * k; rig.phi = lerp(f.phi, t.phi, k);
  const cam = rig.camera;
  if (cam.isPerspectiveCamera) {
    rig.radius = f.radius * Math.pow((t.radius || f.radius) / f.radius, k);
    if (t.fov) { perspCam.fov = lerp(f.fov, t.fov, k); perspCam.updateProjectionMatrix(); state.fov = perspCam.fov; }
  } else { cam.zoom = f.zoom * Math.pow((t.zoom || f.zoom) / f.zoom, k); cam.updateProjectionMatrix(); }
  rig.update();
  if (k >= 1) { tween = null; syncUI(); }
}
/** Close-up looking at the cut face of the selected assembly. */
function sectionCloseupView() {
  const as = selectedAssembly(), ex = state.explode * EXPLODE_STEP;
  const C = cutPoint(as).addScaledVector(as.yW, as.v0 + as.Htot * 0.5 + 2 * ex);
  const roomCenter = new THREE.Vector3(3, 1.35, 2.2);
  const out = as.xW.clone(); if (out.dot(roomCenter.clone().sub(C)) < 0) out.negate();
  const k = 1 + state.explode * 1.6;
  const off = as.zW.clone().multiplyScalar(0.17 * k).addScaledVector(out, 0.1 * k).addScaledVector(as.yW, 0.06 * k);
  const r = off.length();
  return { mode: '3d', type: 'persp', target: C.toArray(), radius: r, phi: Math.acos(clamp(off.y / r, -1, 1)), theta: Math.atan2(off.x, off.z), fov: 35 };
}
function applyPreset(id) {
  const p = CAMERA_PRESETS.find((c) => c.id === id); if (!p) return;
  if (state.mode !== '3d') setMode('3d');
  if (p.dynamic) {
    if (!state.section) { state.section = true; applySection(); }
    animateTo(sectionCloseupView(), 750);
  } else animateTo(Object.assign({ mode: '3d' }, p.view));
  state.viewName = p.label;
  updateBadge(); syncUI();
}
function setMode(mode, { keepView = false } = {}) {
  if (mode === state.mode) return;
  tween = null;
  if (mode === 'schem') {
    stashed3DView = getView();
    state.mode = 'schem';
    rig.enableRotate = false;
    if (!keepView) { fitSchematic(); state.viewName = 'System diagram'; }
  } else {
    state.mode = '3d';
    rig.enableRotate = true;
    if (!keepView) { setView(stashed3DView || Object.assign({ mode: '3d' }, CAMERA_PRESETS[0].view)); state.viewName = stashed3DView ? state.viewName === 'System diagram' ? 'Custom' : state.viewName : 'Perspective'; }
  }
  applyVisibility(); updateBadge(); syncUI(); requestRender();
}
function fitSchematic() {
  const b = SCHEM.bounds, aspect = viewW / viewH;
  rig.camera = schemCam; rig.theta = 0; rig.phi = Math.PI / 2; rig.radius = 10;
  rig.target.set((b.x0 + b.x1) / 2, (b.y0 + b.y1) / 2, 0);
  schemCam.zoom = Math.min((SCHEM_H * aspect) / ((b.x1 - b.x0) * 1.04), SCHEM_H / ((b.y1 - b.y0) * 1.06));
  schemCam.updateProjectionMatrix();
  rig.update();
}
function saveSlot(i) {
  const input = document.querySelector(`.slot[data-slot="${i}"] input`);
  const name = (input && input.value.trim()) || (state.viewName !== 'Custom' ? state.viewName : `View ${i + 1}`);
  state.slots[i] = { name, view: getView() };
  toast(`Saved “${name}” to slot ${i + 1}`);
  syncUI();
}
function gotoSlot(i) {
  const s = state.slots[i]; if (!s) { toast(`Slot ${i + 1} is empty`); return; }
  animateTo(s.view);
  state.viewName = s.name; updateBadge();
}
function updateBadge() {
  const mode = state.mode === 'schem' ? 'Diagram' : (rig.camera === orthoCam ? 'Orthographic' : 'Perspective');
  $('#viewBadge').innerHTML = `${escapeHtml(state.viewName)}<small>${mode}</small>`;
}
const escapeHtml = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function wireUI() {
  const panel = $('#panel');
  panel.addEventListener('input', (e) => {
    const t = e.target, v = Number(t.value);
    switch (t.id) {
      case 'fov': setFov(v); rig.update(); break;
      case 'xray': state.xray = v / 100; applyXray(); break;
      case 'brightness': state.brightness = v / 100; updateLighting(); break;
      case 'dim': state.dim = v / 100; updateLighting(); break;
      case 'explode': state.explode = v / 100; applyExplode(); break;
      case 'cutPos': state.cutPos = v / 100; updateSectionPlane(); break;
      case 'labelScale': state.labelScale = v / 100; break;
      default: return;
    }
    syncValues(); requestRender();
  });
  panel.addEventListener('change', (e) => {
    const t = e.target;
    if (t.dataset.layer) { layerOn[t.dataset.layer] = t.checked; soloState = null; onLayersChanged(); return; }
    if (t.dataset.zone) { zoneOn[t.dataset.zone] = t.checked; onLayersChanged(); return; }
    switch (t.id) {
      case 'edges': state.edges = t.checked; applyXray(); break;
      case 'glow': state.glow = t.checked; updateLighting(); break;
      case 'section': state.section = t.checked; applySection(); break;
      case 'assembly': state.selected = Number(t.value); applyExplode(); applySection(); break;
      case 'shadows': state.shadows = t.checked; applyShadows(); break;
      case 'exportTransparent': state.exportTransparent = t.checked; break;
      case 'hideUI': setHideUI(t.checked); break;
      case 'aspect': state.aspect = t.value; layout(); break;
      default: return;
    }
    syncUI(); requestRender();
  });
  panel.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const d = b.dataset;
    if (d.mode) { setMode(d.mode); return; }
    if (d.preset) { applyPreset(d.preset); return; }
    if (d.gact) { groupAction(b.closest('.grp').dataset.group, d.gact); return; }
    if (d.zonly) { zoneOnly(d.zonly); return; }
    if (d.cct) { state.cct = Number(d.cct); updateLighting(); syncUI(); return; }
    if (d.bg) { state.bg = d.bg; applyBackground(); syncUI(); requestRender(); return; }
    if (d.scale) { state.exportScale = Number(d.scale); syncUI(); return; }
    if (d.act) {
      const i = Number(b.closest('.slot').dataset.slot);
      if (d.act === 'save') saveSlot(i); else if (d.act === 'go') gotoSlot(i);
      else { state.slots[i] = null; b.closest('.slot').querySelector('input').value = ''; syncUI(); }

      case 'zonesAll': ZONES.forEach((z) => (zoneOn[z.id] = true)); onLayersChanged(); break;
      case 'layersAll': LAYERS.forEach((l) => (layerOn[l.id] = true)); soloState = null; onLayersChanged(); break;
      case 'layersReset': LAYERS.forEach((l) => (layerOn[l.id] = l.on)); soloState = null; onLayersChanged(); break;
      case 'closeupBtn': applyPreset('section'); break;
      case 'detailReset': state.explode = 0; state.section = false; applyExplode(); applySection(); syncUI(); break;
      case 'exportBtn': exportPNG(state.viewName); break;
      case 'exportAllBtn': exportAllSaved(); break;
    }
  });
  panel.addEventListener('keydown', (e) => {               // Enter in a slot name saves
    if (e.key === 'Enter' && e.target.closest('.slot')) saveSlot(Number(e.target.closest('.slot').dataset.slot));
  });
  $('#panelTab').addEventListener('click', togglePanel);
}

function groupAction(gid, act) {
  const ids = LAYERS.filter((l) => l.group === gid).map((l) => l.id);
  if (act === 'solo') {
    if (soloState && soloState.group === gid) { Object.assign(layerOn, soloState.saved); soloState = null; }
    else {
      const saved = soloState ? soloState.saved : Object.assign({}, layerOn);
      const anyOn = ids.some((id) => saved[id]);
      LAYERS.forEach((l) => { layerOn[l.id] = l.group === gid ? (anyOn ? saved[l.id] : true) : false; });
      soloState = { group: gid, saved };
    }
  } else {
    ids.forEach((id) => (layerOn[id] = act === 'show'));
    soloState = null;
  }
  onLayersChanged();
}
function zoneOnly(id) {
  const only = ZONES.every((z) => zoneOn[z.id] === (z.id === id));
  ZONES.forEach((z) => (zoneOn[z.id] = only ? true : z.id === id));
  onLayersChanged();
}

function syncValues() {

function syncUI() {

  const set = (id, prop, val) => { const el = $('#' + id); if (el && el[prop] !== val) el[prop] = val; };
  set('fov', 'value', String(Math.round(state.fov)));
  set('xray', 'value', String(Math.round(state.xray * 100)));
  set('edges', 'checked', state.edges);
  set('glow', 'checked', state.glow);
  set('brightness', 'value', String(Math.round(state.brightness * 100)));
  set('dim', 'value', String(Math.round(state.dim * 100)));
  set('assembly', 'value', String(state.selected));
  set('explode', 'value', String(Math.round(state.explode * 100)));
  set('section', 'checked', state.section);
  set('cutPos', 'value', String(Math.round(state.cutPos * 100)));

  set('exportTransparent', 'checked', state.exportTransparent);
  set('hideUI', 'checked', state.hideUI);
  set('aspect', 'value', state.aspect);
  $('#fov').disabled = state.mode !== '3d' || rig.camera !== perspCam;
  document.querySelectorAll('.slot').forEach((el) => {
    const i = Number(el.dataset.slot), s = state.slots[i];
    el.classList.toggle('filled', !!s);
    el.querySelector('[data-act="go"]').disabled = !s;
    const input = el.querySelector('input');
    if (s && document.activeElement !== input && !input.value) input.value = s.name;
  });
  $('#exportAllBtn').disabled = !state.slots.some(Boolean);
  syncValues();
}

function applyXray() {
  archMats.forEach((m) => {
    const o = m.userData.xray ? clamp(state.xray * m.userData.scale, 0, 1) : 1;
    const transparent = o < 0.995;
    if (m.transparent !== transparent) m.needsUpdate = true;
    m.transparent = transparent; m.opacity = o; m.depthWrite = !transparent;
  });
  archEdgeMat.opacity = clamp(0.4 + state.xray * 0.45, 0, 0.9);
  archEdgeMat.visible = state.edges;
  requestRender();
}
function applyBackground(forceTransparent = false) {
  const bg = BACKGROUNDS[state.bg], transparent = forceTransparent || bg.color === null;
  if (transparent) renderer.setClearColor(0x000000, 0); else renderer.setClearColor(bg.color, 1);
  const stage = $('#stage');
  stage.classList.toggle('checker', bg.color === null);
  stage.style.backgroundColor = bg.color || '';
}
function applyShadows() {
  renderer.shadowMap.enabled = state.shadows;
  keyLight.castShadow = state.shadows;
  scene.traverse((o) => { if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => (m.needsUpdate = true)); });
  requestRender();
}
function setHideUI(on) {
  state.hideUI = on;
  document.body.classList.toggle('capture', on);
  const hint = $('#captureHint');
  if (on) { hint.classList.add('show'); clearTimeout(setHideUI._t); setHideUI._t = setTimeout(() => hint.classList.remove('show'), 2600); }
  else hint.classList.remove('show');
  applyVisibility(); syncUI();
}
function togglePanel() {
  const c = $('#app').classList.toggle('collapsed');
  $('#panelTab').textContent = c ? '⟨' : '⟩';
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* =====================================================================
   17. EXPORT — PNG at 1×/2×/4× of the current view, labels composited,
   optional transparent background. File name = brand_view_timestamp.
   ===================================================================== */
function maxCanvasDim() {
  const gl = renderer.getContext();
  const rb = gl.getParameter(gl.MAX_RENDERBUFFER_SIZE), vp = gl.getParameter(gl.MAX_VIEWPORT_DIMS);
  return Math.min(rb, vp[0], vp[1], 16384);
}
function effectiveExportScale() {
  const lim = maxCanvasDim();
  return Math.min(state.exportScale, lim / Math.max(viewW, viewH, 1));
}
function renderTo(cam) { if (state.mode === 'schem') renderer.render(schemScene, schemCam); else renderer.render(scene, cam); }

async function renderPNGBlob() {
  const s = effectiveExportScale(), prevPR = renderer.getPixelRatio();
  const transparent = state.exportTransparent || BACKGROUNDS[state.bg].color === null;
  try {
    renderer.setPixelRatio(s);                          // resizes the drawing buffer only (CSS size unchanged)
    applyBackground(transparent);
    renderTo(rig.camera);
    const out = makeCanvas(glCanvas.width, glCanvas.height), ctx = out.getContext('2d');
    ctx.drawImage(glCanvas, 0, 0);
    ctx.setTransform(out.width / viewW, 0, 0, out.height / viewH, 0, 0);
    drawOverlay(ctx, viewW, viewH, rig.camera);
    return { blob: await new Promise((res) => out.toBlob(res, 'image/png')), s, w: out.width, h: out.height };
  } finally {
    renderer.setPixelRatio(prevPR);
    applyBackground(false);
    renderFrame();
  }
}
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
async function exportPNG(viewName, { quiet = false } = {}) {
  const { blob, s, w, h } = await renderPNGBlob();
  if (!blob) { toast('Export failed — try a smaller scale'); return; }
  const sx = Number.isInteger(s) ? s : s.toFixed(1);
  const name = `${slug(BRAND.name)}_${slug(viewName || 'view')}_${timestamp()}_${sx}x.png`;
  downloadBlob(blob, name);
  if (!quiet) toast(`Exported ${w} × ${h} px — ${name}`);
  return name;
}
async function exportAllSaved() {
  const filled = state.slots.map((s, i) => ({ s, i })).filter((o) => o.s);
  if (!filled.length) { toast('No saved views yet — use Save in the View section'); return; }
  const keep = getView(), keepName = state.viewName;
  for (const { s, i } of filled) {
    setView(s.view); state.viewName = s.name; updateBadge();
    await exportPNG(s.name || `view-${i + 1}`, { quiet: true });
    await new Promise((r) => setTimeout(r, 450));       // give the browser time between downloads
  }
  setView(keep); state.viewName = keepName; updateBadge();
  toast(`Exported ${filled.length} saved view${filled.length > 1 ? 's' : ''}`);
}

/* =====================================================================
   18. LAYOUT, RESIZE & RENDER LOOP
   ===================================================================== */
let viewW = 1, viewH = 1, needsRender = true;
function requestRender() { needsRender = true; }
function layout() {
  const vp = $('#viewport'), W = Math.max(1, vp.clientWidth), H = Math.max(1, vp.clientHeight);
  let w = W, h = H;
  if (state.aspect !== 'fill') {
    const [a, b] = state.aspect.split(':').map(Number), r = a / b;
    if (W / H > r) { h = H; w = Math.round(H * r); } else { w = W; h = Math.round(W / r); }
  }
  const stage = $('#stage');
  Object.assign(stage.style, { width: w + 'px', height: h + 'px', left: Math.round((W - w) / 2) + 'px', top: Math.round((H - h) / 2) + 'px' });
  const wasW = viewW;
  viewW = w; viewH = h;
  renderer.setSize(w, h, true);
  const dpr = renderer.getPixelRatio();
  overlayCanvas.width = Math.round(w * dpr); overlayCanvas.height = Math.round(h * dpr);
  overlayCanvas.style.width = w + 'px'; overlayCanvas.style.height = h + 'px';
  updateCameraAspect(w / h);
  if (state.mode === 'schem' && wasW !== w && state.viewName === 'System diagram') fitSchematic();
  if ($('#exportInfo')) syncValues();
  requestRender();
}
function renderFrame() {
  renderTo(rig.camera);
  const dpr = renderer.getPixelRatio();
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawOverlay(octx, viewW, viewH, rig.camera);
}
function loop(now) {
  requestAnimationFrame(loop);
  if (tween) { stepTween(now); needsRender = true; }
  if (needsRender) { needsRender = false; renderFrame(); }
}

/* Double-click: re-center the orbit on the clicked point */
const raycaster = new THREE.Raycaster();
function shownInScene(o) { for (let p = o; p; p = p.parent) if (!p.visible) return false; return true; }
glCanvas.addEventListener('dblclick', (e) => {
  if (state.mode !== '3d') return;
  const r = glCanvas.getBoundingClientRect();
  raycaster.setFromCamera({ x: ((e.clientX - r.left) / r.width) * 2 - 1, y: -((e.clientY - r.top) / r.height) * 2 + 1 }, rig.camera);
  const hit = raycaster.intersectObjects(world.children, true).find((h) => h.object.isMesh && shownInScene(h.object) &&
    !(h.object.material.transparent && h.object.material.opacity < 0.9));
  if (!hit) return;
  const cam = rig.camera, off = cam.position.clone().sub(hit.point), rr = off.length();
  const v = getView();
  v.target = hit.point.toArray();
  if (cam.isPerspectiveCamera) { v.radius = rr; v.phi = Math.acos(clamp(off.y / rr, -1, 1)); v.theta = Math.atan2(off.x, off.z); }
  animateTo(v, 450);
  state.viewName = 'Custom'; updateBadge();
});

/* Keyboard shortcuts: H hide UI · Esc exit capture · P panel · E export · 1–6 recall · Shift+1–6 save */
window.addEventListener('keydown', (e) => {
  if (e.target.matches && e.target.matches('input[type=text], select, textarea')) return;
  const k = e.key.toLowerCase();
  if (k === 'h' || (k === 'escape' && state.hideUI)) { setHideUI(!state.hideUI); e.preventDefault(); }
  else if (k === 'p') togglePanel();
  else if (k === 'e' && !e.ctrlKey && !e.metaKey) exportPNG(state.viewName);
  else if (/^Digit[1-6]$/.test(e.code)) { const i = Number(e.code.slice(5)) - 1; if (e.shiftKey) saveSlot(i); else gotoSlot(i); }
});

/* =====================================================================
   INIT
   ===================================================================== */
buildSystem();
buildLabels();
buildSchematic();
buildUI();
rig.onChange = requestRender;
rig.onUser = () => { tween = null; if (state.viewName !== 'Custom' && state.mode === '3d') { state.viewName = 'Custom'; updateBadge(); syncUI(); } };
applyXray();
applyBackground();
updateLighting();
layout();
new ResizeObserver(layout).observe($('#viewport'));
window.addEventListener('resize', layout);
setView(Object.assign({ mode: '3d' }, CAMERA_PRESETS[0].view));
state.viewName = CAMERA_PRESETS[0].label;
updateBadge(); syncUI(); applyVisibility();
requestAnimationFrame(loop);

// Handy for scripting screenshots from the browser console
window.LEDViz = { state, ZONES, LAYERS, layerOn, zoneOn, getView, setView, applyPreset, setMode, exportPNG, renderPNGBlob, onLayersChanged, updateLighting, applyExplode, applySection };
</script>
</body>
</html>
