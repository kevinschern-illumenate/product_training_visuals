function applyXray() {
  archMats.forEach((m) => {
    const o = m.userData.xray ? clamp(state.xray * m.userData.scale, 0, 1) : 1;
    const transparent = o < 0.995;
    if (m.transparent !== transparent) m.needsUpdate = true;
    m.transparent = transparent; m.opacity = o; m.depthWrite = !transparent;
  });
  archEdgeMat.opacity = clamp(0.4 + state.xray * 0.45, 0, 0.9);
  archEdgeMat.visible = state.edges;
  requestRender();
}
function applyBackground(forceTransparent = false) {
  const bg = BACKGROUNDS[state.bg], transparent = forceTransparent || bg.color === null;
  if (transparent) renderer.setClearColor(0x000000, 0); else renderer.setClearColor(bg.color, 1);
  const stage = $('#stage');
  stage.classList.toggle('checker', bg.color === null);
  stage.style.backgroundColor = bg.color || '';
}
function applyShadows() {
  renderer.shadowMap.enabled = state.shadows;
  keyLight.castShadow = state.shadows;
  scene.traverse((o) => { if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => (m.needsUpdate = true)); });
  requestRender();
}
function setHideUI(on) {
  state.hideUI = on;
  document.body.classList.toggle('capture', on);
  const hint = $('#captureHint');
  if (on) { hint.classList.add('show'); clearTimeout(setHideUI._t); setHideUI._t = setTimeout(() => hint.classList.remove('show'), 2600); }
  else hint.classList.remove('show');
  applyVisibility(); syncUI();
}
function togglePanel() {
  const c = $('#app').classList.toggle('collapsed');
  $('#panelTab').textContent = c ? '⟨' : '⟩';
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* =====================================================================
   17. EXPORT — PNG at 1×/2×/4× of the current view, labels composited,
   optional transparent background. File name = brand_view_timestamp.
   ===================================================================== */
function maxCanvasDim() {
  const gl = renderer.getContext();
  const rb = gl.getParameter(gl.MAX_RENDERBUFFER_SIZE), vp = gl.getParameter(gl.MAX_VIEWPORT_DIMS);
  return Math.min(rb, vp[0], vp[1], 16384);
}
function effectiveExportScale() {
  const lim = maxCanvasDim();
  return Math.min(state.exportScale, lim / Math.max(viewW, viewH, 1));
}
function renderTo(cam) {
  if (state.mode === 'schem') renderer.render(schemScene, schemCam);
  else if (state.mode === 'train') {
    const v = currentVisual();
    if (v.kind === '3d') { ensureTrain3D(v); renderer.render(trainScene, perspCam); } else renderer.render(emptyScene, perspCam);
  } else renderer.render(scene, cam);
}

async function renderPNGBlob() {
  const s = effectiveExportScale(), prevPR = renderer.getPixelRatio();
  const transparent = state.exportTransparent || BACKGROUNDS[state.bg].color === null;
  try {
    renderer.setPixelRatio(s);                          // resizes the drawing buffer only (CSS size unchanged)
    applyBackground(transparent);
    renderTo(rig.camera);
    const out = makeCanvas(glCanvas.width, glCanvas.height), ctx = out.getContext('2d');
    ctx.drawImage(glCanvas, 0, 0);
    ctx.setTransform(out.width / viewW, 0, 0, out.height / viewH, 0, 0);
    drawOverlay(ctx, viewW, viewH, rig.camera);
    return { blob: await new Promise((res) => out.toBlob(res, 'image/png')), s, w: out.width, h: out.height };
  } finally {
    renderer.setPixelRatio(prevPR);
    applyBackground(false);
    renderFrame();
  }
}
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
async function exportPNG(viewName, { quiet = false } = {}) {
  const { blob, s, w, h } = await renderPNGBlob();
  if (!blob) { toast('Export failed — try a smaller scale'); return; }
  const sx = Number.isInteger(s) ? s : s.toFixed(1);
  const name = `${slug(BRAND.name)}_${slug(viewName || 'view')}_${timestamp()}_${sx}x.png`;
  downloadBlob(blob, name);
  if (!quiet) toast(`Exported ${w} × ${h} px — ${name}`);
  return name;
}
async function exportAllSaved() {
  const filled = state.slots.map((s, i) => ({ s, i })).filter((o) => o.s);
  if (!filled.length) { toast('No saved views yet — use Save in the View section'); return; }
  const keep = getView(), keepName = state.viewName;
  for (const { s, i } of filled) {
    setView(s.view); state.viewName = s.name; updateBadge();
    await exportPNG(s.name || `view-${i + 1}`, { quiet: true });
    await new Promise((r) => setTimeout(r, 450));       // give the browser time between downloads
  }
  setView(keep); state.viewName = keepName; updateBadge();
  toast(`Exported ${filled.length} saved view${filled.length > 1 ? 's' : ''}`);
}

/* =====================================================================
   18. LAYOUT, RESIZE & RENDER LOOP
   ===================================================================== */
let viewW = 1, viewH = 1, needsRender = true;
function requestRender() { needsRender = true; }
function layout() {
  const vp = $('#viewport'), W = Math.max(1, vp.clientWidth), H = Math.max(1, vp.clientHeight);
  let w = W, h = H;
  if (state.aspect !== 'fill') {
    const [a, b] = state.aspect.split(':').map(Number), r = a / b;
    if (W / H > r) { h = H; w = Math.round(H * r); } else { w = W; h = Math.round(W / r); }
  }
  const stage = $('#stage');
  Object.assign(stage.style, { width: w + 'px', height: h + 'px', left: Math.round((W - w) / 2) + 'px', top: Math.round((H - h) / 2) + 'px' });
  const wasW = viewW;
  viewW = w; viewH = h;
  renderer.setSize(w, h, true);
  const dpr = renderer.getPixelRatio();
  overlayCanvas.width = Math.round(w * dpr); overlayCanvas.height = Math.round(h * dpr);
  overlayCanvas.style.width = w + 'px'; overlayCanvas.style.height = h + 'px';
  updateCameraAspect(w / h);
  if (state.mode === 'schem' && wasW !== w && state.viewName === 'System diagram') fitSchematic();
  if ($('#exportInfo')) syncValues();
  requestRender();
}
function renderFrame() {
  renderTo(rig.camera);
  const dpr = renderer.getPixelRatio();
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawOverlay(octx, viewW, viewH, rig.camera);
  if (recording) {
    const r = recording, bg = BACKGROUNDS[state.bg].color || '#ffffff';
    r.ctx.fillStyle = bg; r.ctx.fillRect(0, 0, r.rc.width, r.rc.height);
    r.ctx.drawImage(glCanvas, 0, 0, r.rc.width, r.rc.height);
    r.ctx.drawImage(overlayCanvas, 0, 0, r.rc.width, r.rc.height);
  }
}
function loop(now) {
  requestAnimationFrame(loop);
  if (tween) { stepTween(now); needsRender = true; }
  if (state.mode === 'train' && currentVisual().animated && state.animPlay) {
    animT = now / 1000; needsRender = true;
    if (trainMeta && trainMeta.anim) trainMeta.anim.forEach((m) => { m.map.offset.x = -animT * 3; });
  }
  if (needsRender) { needsRender = false; renderFrame(); }
}

/* Double-click: re-center the orbit on the clicked point */
const raycaster = new THREE.Raycaster();
function shownInScene(o) { for (let p = o; p; p = p.parent) if (!p.visible) return false; return true; }
glCanvas.addEventListener('dblclick', (e) => {
  if (state.mode !== '3d') return;
  const r = glCanvas.getBoundingClientRect();
  raycaster.setFromCamera({ x: ((e.clientX - r.left) / r.width) * 2 - 1, y: -((e.clientY - r.top) / r.height) * 2 + 1 }, rig.camera);
  const hit = raycaster.intersectObjects(world.children, true).find((h) => h.object.isMesh && shownInScene(h.object) &&
    !(h.object.material.transparent && h.object.material.opacity < 0.9));
  if (!hit) return;
  const cam = rig.camera, off = cam.position.clone().sub(hit.point), rr = off.length();
  const v = getView();
  v.target = hit.point.toArray();
  if (cam.isPerspectiveCamera) { v.radius = rr; v.phi = Math.acos(clamp(off.y / rr, -1, 1)); v.theta = Math.atan2(off.x, off.z); }
  animateTo(v, 450);
  state.viewName = 'Custom'; updateBadge();
});

/* Keyboard shortcuts: H hide UI · Esc exit capture · P panel · E export · 1–6 recall · Shift+1–6 save */
window.addEventListener('keydown', (e) => {
  if (e.target.matches && e.target.matches('input:not([type=checkbox]):not([type=range]), select, textarea')) return;
  const k = e.key.toLowerCase();
  if (k === 'h' || (k === 'escape' && state.hideUI)) { setHideUI(!state.hideUI); e.preventDefault(); }
  else if (k === 'p') togglePanel();
  else if (k === 'e' && !e.ctrlKey && !e.metaKey) exportPNG(exportBaseName());
  else if (state.mode === 'train' && (k === 'arrowright' || k === 'arrowleft')) { state.trainStep = clamp(trainStep() + (k === 'arrowright' ? 1 : -1), 1, currentVisual().steps); syncUI(); updateBadge(); requestRender(); e.preventDefault(); }
  else if (/^Digit[1-6]$/.test(e.code)) { const i = Number(e.code.slice(5)) - 1; if (e.shiftKey) saveSlot(i); else gotoSlot(i); }
});


/* =====================================================================
   19. TRAINING VISUALS — outline sections 3 (The math) & 4 (Building a run)
   Each TRAINING_VISUALS entry is one slide-ready visual:
     kind '2d' → vector drawing in a 1600×900 slide space (crisp at any export scale)
     kind '3d' → its own 3D scene + annotation overlay
   "steps" are build steps, so one slide can reveal a piece at a time

function drawCut(ctx, step) {
  const C = cutMath(), bx0 = 100, bx1 = 1500, pxIn = (bx1 - bx0) / C.runIn, tapeX = bx0 + C.tapeIn * pxIn;
  dimH(ctx, bx0, bx1, 168, `${fmtLen(C.runIn * IN)} = ${fmt(C.runIn, 2)} in run`, { size: 17 });
  roundRect(ctx, bx0, 200, bx1 - bx0, 44, 6); ctx.fillStyle = P.channel; ctx.fill();
  roundRect(ctx, bx0 + 4, 211, Math.max(0, tapeX - bx0 - 4), 22, 3); ctx.fillStyle = litColor(1).getStyle(); ctx.fill();
  if (step >= 2) {
    const every = C.iv * pxIn < 6 ? Math.ceil(6 / (C.iv * pxIn)) : 1;
    for (let k = 1; k <= C.seg; k += every) { const x = bx0 + k * C.iv * pxIn; line(ctx, [[x, 208], [x, 236]], { color: hexA('#000000', 0.35), width: 1.2 }); }
    dimH(ctx, bx0, tapeX, 290, `${C.seg} segments × ${fmt(C.iv, 2)} in = ${fmt(C.tapeIn, 2)} in of tape`, { size: 17 });
  }
  if (C.dark > 0) hatch(ctx, tapeX, 206, bx1 - tapeX, 32, P.warn);
  ctx.fillStyle = '#5a616c'; ctx.fillRect(bx1, 196, 8, 52);
  txt(ctx, 'Profile (cut to length)', bx0, 266, { size: 14, color: P.muted });
  if (step < 3) return;
  const winIn = Math.min(C.runIn, C.iv * 4 + Math.max(C.dark, C.iv * 0.5) + 1), w0 = C.runIn - winIn;
  const hx0 = bx0 + w0 * pxIn;
  roundRect(ctx, hx0 - 4, 192, bx1 - hx0 + 16, 60, 6); ctx.lineWidth = 2.5; ctx.strokeStyle = P.brand; ctx.stroke();
  const ix0 = 160, ix1 = 1400, pI = (ix1 - ix0) / winIn, X = (inch) => ix0 + (inch - w0) * pI;
  line(ctx, [[(hx0 + bx1) / 2, 252], [(hx0 + bx1) / 2, 340]], { color: P.brand, width: 2, dash: [6, 6] });
  card(ctx, 100, 340, 1400, 300, { stroke: P.brand, lw: 2 });
  ctx.fillStyle = P.soft; ctx.fillRect(ix0, 414, ix1 - ix0, 152);
  ctx.fillStyle = P.channel; ctx.fillRect(ix0, 400, ix1 - ix0, 14); ctx.fillRect(ix0, 566, ix1 - ix0, 14);
  const tEnd = X(C.tapeIn);
  ctx.fillStyle = P.pcb; ctx.fillRect(ix0, 446, tEnd - ix0, 88);
  line(ctx, [[ix0, 446], [tEnd, 446]], { color: P.faint, width: 1 }); line(ctx, [[ix0, 534], [tEnd, 534]], { color: P.faint, width: 1 });
  const firstSeg = Math.floor(w0 / C.iv + 1e-9);
  for (let s = firstSeg; s < C.seg; s++) {
    for (let k = 0; k < EXAMPLE.ledsPerSegment; k++) {
      const inch = s * C.iv + C.iv * (k + 0.5) / EXAMPLE.ledsPerSegment, x = X(inch);

const currentVisual = () => TRAINING_VISUALS.find((v) => v.id === state.trainVisual) || TRAINING_VISUALS[0];
function visualOpts(v) {
  const o = Object.assign({}, state.trainOpts[v.id] || {});
  (v.options || []).forEach((op) => { if (o[op.id] === undefined) o[op.id] = resolve(op.def); });
  return o;
}
function trainStep() { return clamp(state.trainStep, 1, currentVisual().steps); }

/** Build (or reuse) the current 3D visual's scene; rebuilds when inputs, lighting or step change. */
let trainGroup = null, trainMeta = null, trainKey = '';
function disposeGroup(g) {
  g.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) [].concat(o.material).forEach((m) => { if (m === archEdgeMat) return; if (m.userData.ownMap && m.map) m.map.dispose(); m.dispose(); });
  });
}
function ensureTrain3D(v) {
  const step = trainStep(), o = visualOpts(v);
  const key = JSON.stringify([v.id, v.key ? v.key(step, o) : null, EXAMPLE, state.cct, state.glow, state.dim, state.brightness]);
  if (key === trainKey && trainGroup) return;
  if (trainGroup) { trainRoot.remove(trainGroup); disposeGroup(trainGroup); }
  const r = v.build(step, o);
  trainGroup = r.group; trainMeta = r.meta; trainKey = key;
  trainRoot.add(trainGroup);
}
function drawTraining(ctx, w, h, cam) {
  const v = currentVisual(), step = trainStep();
  P = slidePalette();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (v.kind === '3d' && trainMeta) {
    cam.updateMatrixWorld();
    const proj = (p) => { _pv.copy(p).project(cam); if (_pv.z > 1 || _pv.z < -1) return null; return { x: (_pv.x + 1) / 2 * w, y: (1 - _pv.y) / 2 * h }; };
    v.overlay && v.overlay(ctx, w, h, proj, step, trainMeta);
  }
  withSlide(ctx, w, h, () => { if (v.kind === '2d') v.draw(ctx, step); drawHeading(ctx, v); drawFootnote(ctx); });
}
function showVisual(id, { keepView = false, step } = {}) {
  state.trainVisual = id;
  const v = currentVisual();
  state.trainStep = step ?? v.steps;
  state.viewName = `${v.section} ${v.title}`;
  rig.enabled = v.kind === '3d';
  rig.enableRotate = true;
  if (v.kind === '3d') {
    rig.camera = perspCam;
    if (!keepView) { const vw = v.view(); rig.target.fromArray(vw.target); rig.theta = vw.theta; rig.phi = vw.phi; rig.radius = vw.radius; setFov(vw.fov); rig.update(); }
  }
  updateBadge(); syncUI(); requestRender();
}
function exportBaseName() {
  if (state.mode !== 'train') return state.viewName;
  const v = currentVisual();

}
async function exportAllSteps() {
  const v = currentVisual(), keep = state.trainStep;
  for (let s = 1; s <= v.steps; s++) {
    state.trainStep = s; syncUI();
    await exportPNG(exportBaseName(), { quiet: true });
    await new Promise((r) => setTimeout(r, 450));
  }
  state.trainStep = keep; syncUI(); requestRender();
  toast(`Exported ${v.steps} build step${v.steps > 1 ? 's' : ''} of “${v.title}”`);
}
/** Record the animated visual to a video file (MP4 where the browser supports it, otherwise WebM). */
async function recordAnimation(seconds = 6) {
  const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  const type = window.MediaRecorder && types.find((t) => MediaRecorder.isTypeSupported(t));
  if (!type) { toast('This browser cannot record video'); return; }
  const rc = makeCanvas(glCanvas.width - (glCanvas.width % 2), glCanvas.height - (glCanvas.height % 2));
  recording = { rc, ctx: rc.getContext('2d') };
  const chunks = [], rec = new MediaRecorder(rc.captureStream(30), { mimeType: type, videoBitsPerSecond: 10e6 });
  rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  const stopped = new Promise((r) => (rec.onstop = r));
  state.animPlay = true; syncUI();
  renderFrame(); rec.start(); toast(`Recording ${seconds} s…`);
  await new Promise((r) => setTimeout(r, seconds * 1000));
  rec.stop(); await stopped; recording = null;
  const ext = type.includes('mp4') ? 'mp4' : 'webm';
  downloadBlob(new Blob(chunks, { type }), `${slug(BRAND.name)}_${slug(exportBaseName())}_${timestamp()}.${ext}`);
  toast(`Saved ${ext.toUpperCase()} video`);
}
